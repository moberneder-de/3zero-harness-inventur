  const oben = global.length
    ? `<p class="klein" style="margin:14px 0 10px">Lädt in jede Sitzung: ≈ ${zahl(ANWEISUNG.beimStart(global))} Tokens.</p>` + ANWEISUNG.tabelle(global)
    : `<p class="leer">Keine globalen Anweisungen gefunden.</p>`;
  const jeProjekt = bereiche.length ? `<div class="tabelle"><table><thead><tr><th>Projekt</th><th class="zahl">Dateien</th><th class="zahl">Tokens beim Start</th><th class="zahl">bei Bedarf</th><th>Arten</th></tr></thead><tbody>${
    bereiche.map(([b, z]) => `<tr class="haupt"><td class="name">${aufklapp(ordnerName(b))}${ANWEISUNG.limit(z)}<div class="klein">${esc(kurzPfad(b))}</div></td><td class="zahl">${z.length}</td>
      <td class="zahl">${ANWEISUNG.beimStart(z) ? "≈ " + zahl(ANWEISUNG.beimStart(z)) : strich}</td><td class="zahl">${ANWEISUNG.beiBedarf(z) ? "≈ " + zahl(ANWEISUNG.beiBedarf(z)) : strich}</td><td class="klein">${[...new Set(z.map(x => x.art))].map(esc).join(", ")}</td></tr>` +
      inhaltZeile(5, ANWEISUNG.tabelle(z))).join("")}</tbody></table></div>` +
      (weggelassen.length ? `<p class="klein">Nicht gezeigt, weil darin andere Projekte liegen: ${weggelassen.map(b => `<code>${esc(kurzPfad(b))}</code>`).join(", ")}. Was dort liegt, lädt nur in einer Sitzung direkt in diesem Ordner.</p>` : "")
    : '<p class="leer">In den Projekten liegen keine Anweisungsdateien.</p>';
  return abschnitt("anweisungen", "Was als Anweisung in die Sitzung lädt",
    CODEX ? oben : reiter("anweisungen", [["Global", oben], [`Je Projekt${bereiche.length ? ` (${bereiche.length})` : ""}`, jeProjekt]]),
    je(erklaert("Text, den Claude Code beim Start in jede Sitzung lädt, zusätzlich zu seinem eingebauten Systemprompt. Der steht in keiner Datei und fehlt hier.", [
        ["CLAUDE.md", "Deine Anweisungen: global aus <code>~/.claude/CLAUDE.md</code>, je Projekt aus <code>CLAUDE.md</code>, <code>.claude/CLAUDE.md</code> und <code>CLAUDE.local.md</code>, auch aus jedem Ordner darüber."],
        ["Regel", "Dateien aus <code>~/.claude/rules</code> und <code>.claude/rules</code>. Mit <code>paths</code> im Kopf laden sie erst „bei Bedarf“, wenn Claude eine passende Datei mit Lesen, Bearbeiten oder Schreiben anfasst, nicht über die Shell. Unter der Datei steht, bei welchen Mustern."],
        ["verwaist", "Eine gebundene Regel, auf deren Muster im Projekt keine Datei passt: Sie lädt nie, etwa nach dem Umbenennen einer Datei. Ein Hinweis zum Nachsehen, denn Claude Code rechnet Muster mit seiner eigenen Logik. „nicht geprüft“ steht da, wenn sich ein Muster nicht lesen ließ oder das Projekt sehr groß ist. Regeln aus <code>~/.claude/rules</code> prüft die Inventur nicht: Ihr Muster gilt in jedem Projekt."],
        ["Output-Style", "Der Style, den <code>outputStyle</code> in <code>~/.claude/settings.json</code> nennt. Ein eigener Style lässt die eingebauten Programmier-Anweisungen weg, außer mit <code>keep-coding-instructions: true</code> im Kopf."],
        ["Memory", "<code>MEMORY.md</code> des Projekts, die Claude selbst schreibt. Geladen werden nur die ersten 200 Zeilen oder 25 KB."],
        ["AGENTS.md", "Liest Claude Code nur, wenn es im Projekt und darüber keine CLAUDE.md gibt, oder wenn eine CLAUDE.md sie mit <code>@AGENTS.md</code> einbindet („eingebunden“): So teilen sich Claude Code und Codex eine Datei. Sonst steht sie als „wirkungslos“ da. Eine eingebundene schaltest du über ihre CLAUDE.md ab. Die Einstellung <code>instructionFiles</code> (in <code>/config</code> „Project instructions“) ändert das: <code>claude-md-and-agents-md</code> lädt beide, <code>claude-md</code> nie eine AGENTS.md für sich, <code>managed-only</code> nur noch die verwalteten Anweisungen (Marke „managed-only“)."],
        ["groß", "Eine CLAUDE.md mit mehr als 200 Zeilen oder mehr als 5.000 Tokens. Die Doku von Claude Code rät zu unter 200 Zeilen: Längere Dateien kosten Kontext, und Claude hält sich schlechter daran. Was nur einen Teil des Codes betrifft, kann in eine Regel mit <code>paths</code> wandern und lädt dann erst bei Bedarf."],
        ["über dem Limit", "Die Anweisungsdateien, die im Projekt beim Start laden, haben zusammen mit den globalen mehr als 150.000 Zeichen. Ab dieser Grenze warnt Claude Code beim Start einer Sitzung. Gezählt werden CLAUDE.md, Regeln ohne <code>paths</code> und AGENTS.md. „nahe am Limit“ steht ab 120.000 Zeichen da, bevor Claude Code warnt."],
        ["zwei CLAUDE.md", "Im Projekt liegen <code>CLAUDE.md</code> und <code>.claude/CLAUDE.md</code>. Claude Code lädt beide. Wer nur eine öffnet, hält sie leicht für die ganze Anleitung."],
        ["Tokens", "Geschätzt: Zeichen ÷ 4. Dateien, die eine Anweisung mit <code>@pfad</code> einbindet, zählen nicht mit."]],
      [TOKEN ? "„prüfen“ lässt Claude die CLAUDE.md eines Projekts mit dem Skill <code>claude-md-improver</code> bewerten, oder die AGENTS.md, wenn die CLAUDE.md sie nur einbindet oder es keine gibt: Note, Befunde und Vorschläge. Der Lauf liest nur, und nur im Projekt, dauert einige Minuten und verbraucht Kontingent. Den Knopf gibt es, wenn das Plugin <code>claude-md-management</code> installiert ist. Umgesetzt wird in einer Sitzung im Projekt, nicht hier: Der Bericht liegt dafür als Datei bereit, und der Befehl unter der Karte lässt Claude ihn nur noch umsetzen, ohne neu zu prüfen." : null,
        TOKEN ? "„deaktivieren“ trägt die Datei in <code>claudeMdExcludes</code> in <code>~/.claude/settings.json</code> ein, „einschalten“ nimmt sie wieder heraus. Die Datei selbst bleibt, wie sie ist: Sie liegt oft in einem Repo." : "Schalten geht nur über den Server; als Datei geöffnet ist das Dashboard nur lesbar.",
        "Ohne Knopf bleibt, was ein Muster oder ein Eintrag im Projekt ausschließt, was verwaltet ist, und <code>MEMORY.md</code>: Das Auto-Memory schaltet <code>autoMemoryEnabled</code> für alles zusammen.",
        "Einen Output-Style kann ein Projekt für sich anders wählen (<code>.claude/settings.local.json</code>). Das steht hier nicht.",
        "Die globalen Zeilen, die laden, zählen zur Kontextlast im Überblick. Was nur in einem Projekt lädt, zählt dort nicht, wie bei Projekt-Skills."]),
      erklaert("Text, den Codex beim Start in jede Sitzung lädt, zusätzlich zu seinem eingebauten Systemprompt.", [
        ["AGENTS.md", "Global lädt Codex die erste nicht leere von <code>~/.codex/AGENTS.override.md</code> und <code>~/.codex/AGENTS.md</code>. Die andere steht als „wirkungslos“ da."],
        ["Tokens", "Geschätzt: Zeichen ÷ 4."]],
      ["Die <code>AGENTS.md</code> der Projekte liest die Inventur noch nicht.", "Nur Anzeige: Codex hat dafür keinen Schalter."])));
}

const RECHT = (() => {
  const strich = '<span class="leer">–</span>';
  const marken = z => z.marken.map(statusBadge).join(" ");
  const zusammen = zeilen => ["breit", "verwaist", "widerspricht", "doppelt"].map(m => [m, zeilen.filter(z => z.marken.includes(m)).length])
    .filter(([, n]) => n).map(([m, n]) => `${n} ${m}`).join(", ");
  const datei = z => z.bereich === "global" || z.art === "Vertrauen" ? z.quelle : z.quelle.replace(/^.*\/(\.claude\/[^/]+)$/, "$1");
  const regelArt = z => ["allow", "ask", "deny", "prompt", "forbidden"].includes(z.art);
  // Bash(git push *) steht in der Zeile „Bash“ nur noch als „git push *“; unter Codex ist das Werkzeug das Programm, auch mit Pfad davor
  const werkzeug = z => !regelArt(z) ? RECHT_ART[z.art] || z.art : z.regel.startsWith("mcp__") ? "MCP" : z.regel.split(/[\s(]/)[0].split("/").pop() || z.regel.split(/\s/)[0];
  const kurz = z => { const m = regelArt(z) && z.regel.match(/^[\w-]+\((.*)\)$/s); return m ? m[1] : z.regel; };
  const gebuendelt = zeilen => {
    const gruppen = new Map();
    for (const z of zeilen) {
      const k = [werkzeug(z), z.art, z.quelle, !!z.verwaltet].join("\n");
      if (!gruppen.has(k)) gruppen.set(k, []);
      gruppen.get(k).push(z);
    }
    return `<div class="tabelle"><table><thead><tr><th>Werkzeug</th><th>Art</th><th>Quelle</th><th>Regeln</th></tr></thead><tbody>${
      [...gruppen.values()].sort((x, y) => y.length - x.length).map(g => `<tr><td class="nowrap"><strong>${esc(werkzeug(g[0]))}</strong> <span class="klein">${g.length}</span></td>
        <td class="nowrap">${regelArt(g[0]) ? esc(RECHT_ART[g[0].art]) : strich}${g[0].verwaltet ? '<div class="klein">verwaltet</div>' : ""}</td><td class="klein">${esc(datei(g[0]))}</td>
        <td><div class="regeln">${[...g].sort((x, y) => y.marken.length - x.marken.length).map(z => `<span><code>${esc(kurz(z))}</code>${z.marken.length ? " " + marken(z) : ""}</span>`).join("")}</div></td></tr>`).join("")}</tbody></table></div>`;
  };
  const werkzeuge = zeilen => { const n = new Map(); zeilen.forEach(z => n.set(werkzeug(z), (n.get(werkzeug(z)) || 0) + 1)); return [...n].sort((a, b) => b[1] - a[1]).map(([w]) => w); };
  return { marken, zusammen, datei, gebuendelt, werkzeuge };
})();

/* Was der Harness ohne Rückfrage darf. Der erste Reiter zeigt nur, was markiert ist, mit dem Knopf zum Entfernen
   (nur über den Server); der zweite je Projekt eine Zeile, aufgeklappt nach Werkzeug gebündelt.
   Ein Projekt sammelt schnell Dutzende Regeln, die sich nur im Befehl unterscheiden. */
const RECHT_ART = { allow: "erlaubt", ask: "fragt", prompt: "fragt", deny: "verboten", forbidden: "verboten",
  Modus: "Modus", Ordner: "Ordner", Vertrauen: "vertraut", unlesbar: "unlesbar" };
const kurzPfad = pfad => pfad.replace(/^\/(Users|home)\/[^/]+(?=\/|$)/, "~");
/* Unter-Reiter in einem Tab; das Umschalten erledigt waehleReiter() für alle role="tab" */
function reiter(id, teile) {
  const knoepfe = teile.map(([titel], i) => `<button type="button" role="tab" id="${id}-reiter-${i}" aria-controls="${id}-teil-${i}" aria-selected="${i === 0}"${i ? ' tabindex="-1"' : ""}>${titel}</button>`).join("");
  return `<div class="unterreiter" role="tablist">${knoepfe}</div>` +
    teile.map(([, html], i) => `<div role="tabpanel" id="${id}-teil-${i}" aria-labelledby="${id}-reiter-${i}"${i ? " hidden" : ""}>${html}</div>`).join("");
}
const ordnerName = pfad => pfad === "global" ? je("Global (alle Projekte)", "Global") : pfad.replace(/\/+$/, "").split("/").pop() || pfad;
function renderBerechtigungen() {
  const liste = D.berechtigungen || [];
  const strich = '<span class="leer">–</span>';
  const { marken, zusammen, datei, gebuendelt, werkzeuge } = RECHT;
  const auffaellig = liste.filter(z => z.marken.length);
  const knopf = z => z.aktionen?.entfernen ? `<button type="button" class="zeilenknopf" data-recht="${esc(z.id)}">entfernen</button>` : '<span class="leer">von Hand</span>';
  const oben = auffaellig.length
    ? `<div class="tabelle"><table><thead><tr><th>Regel</th><th data-filter="${je("jedes Projekt", "jeder Bereich")}">${je("Projekt", "Bereich")}</th><th>Quelle</th><th data-filter="jeder Hinweis">Hinweis</th>${TOKEN ? "<th>Aufräumen</th>" : ""}</tr></thead><tbody>${
      auffaellig.map(z => `<tr><td><code>${esc(z.art === "Vertrauen" ? kurzPfad(z.bereich) : z.regel)}</code></td><td class="nowrap">${esc(z.art === "Vertrauen" ? "Vertraute Ordner" : ordnerName(z.bereich))}</td>
        <td class="klein">${esc(datei(z))}</td><td class="nowrap">${marken(z)}</td>${TOKEN ? `<td class="nowrap">${knopf(z)}</td>` : ""}</tr>`).join("")}</tbody></table></div>`
    : '<p class="leer">Nichts Auffälliges: keine breite, verwaiste, widersprüchliche oder doppelte Regel.</p>';
  const gruppe = (titel, pfad, zeilen, inhalt) => `<details class="rechte"><summary><strong>${esc(titel)}</strong>
    <span class="klein">${pfad ? esc(pfad) + " · " : ""}${zeilen.length} ${zeilen.length === 1 ? "Eintrag" : "Einträge"}${zusammen(zeilen) ? " · " + zusammen(zeilen) : ""}</span></summary>${inhalt}</details>`;
  const vertrauen = liste.filter(z => z.art === "Vertrauen");
  const regeln = liste.filter(z => z.art !== "Vertrauen");
  const bereiche = [...new Set(regeln.map(z => z.bereich))];
  const vertrauensTabelle = vertrauen.length ? gruppe("Vertraute Ordner", "", vertrauen, `<div class="tabelle"><table><thead><tr><th>Ordner</th><th>Vertrauen</th><th>Hinweis</th></tr></thead><tbody>${
    vertrauen.map(z => `<tr><td><code>${esc(kurzPfad(z.bereich))}</code></td><td>${esc(z.regel)}</td><td>${marken(z) || strich}</td></tr>`).join("")}</tbody></table></div>`) : "";
  // je Projekt eine Zeile, die auffälligsten zuerst; ein Klick zeigt die gebündelten Regeln
  const MARKEN = ["breit", "verwaist", "widerspricht", "doppelt"].filter(m => regeln.some(z => z.marken.includes(m)));
  const auffaellige = b => regeln.filter(z => z.bereich === b && z.marken.length).length;
  const jeBereich = `<div class="tabelle"><table><thead><tr><th>${je("Projekt", "Bereich")}</th><th class="zahl">Regeln</th>${MARKEN.map(m => `<th class="zahl">${m}</th>`).join("")}<th>Werkzeuge</th></tr></thead><tbody>${
    [...bereiche].sort((x, y) => (y === "global") - (x === "global") || auffaellige(y) - auffaellige(x) || ordnerName(x).localeCompare(ordnerName(y))).map(b => {
      const z = regeln.filter(r => r.bereich === b), anzahl = m => z.filter(r => r.marken.includes(m)).length;
      return `<tr class="haupt"><td class="name">${aufklapp(ordnerName(b))}${b === "global" ? "" : `<div class="klein">${esc(kurzPfad(b))}</div>`}</td><td class="zahl">${z.length}</td>
        ${MARKEN.map(m => `<td class="zahl">${anzahl(m) || strich}</td>`).join("")}<td class="klein">${werkzeuge(z).map(esc).join(", ")}</td></tr>` + inhaltZeile(3 + MARKEN.length, gebuendelt(z));
    }).join("")}</tbody></table></div>`;
  const inhalt = liste.length
    ? reiter("rechte", [[`Auffällig${auffaellig.length ? ` (${auffaellig.length})` : ""}`, oben],
      [`Alle Regeln je ${je("Projekt", "Bereich")}`, (regeln.length ? jeBereich : "") + vertrauensTabelle]])
    : '<p class="leer">Keine Regeln gefunden: Es gelten die Standards des Harness.</p>';
  const legende = eintraege => `<p class="label">Marken</p><ul class="legende">${eintraege.map(([m, text]) => `<li>${statusBadge(m)} <span>${text}</span></li>`).join("")}</ul>`;
  return abschnitt("berechtigungen", "Was ohne Rückfrage erlaubt ist", inhalt,
    je(erklaert("Was Claude Code ohne Rückfrage darf: aus den verwalteten Einstellungen, <code>~/.claude/settings.json</code> und je Projekt aus <code>.claude/settings.json</code> und <code>.claude/settings.local.json</code>.", [],
        [TOKEN ? "Markierte Regeln nimmt „entfernen“ aus ihrer Datei, mit Sicherung daneben. Alles andere änderst du von Hand in der genannten Datei." : "Ändern von Hand in der genannten Datei."],
        legende([["breit", `ein ganzes Werkzeug (etwa <code>Bash</code> ohne Klammer), ein ganzer MCP-Server, ein Interpreter mit beliebigen Argumenten wie <code>Bash(python3:*)</code>, <code>defaultMode: bypassPermissions</code>, Ordner wie <code>~</code>`],
          ["verwaist", "eine Regel für einen MCP-Server, der nicht mehr eingetragen ist"], ["widerspricht", "dieselbe Regel steht auch als ask oder deny; es gilt die strengere"],

/* Tokens je Modell als Tabelle: im Tab „Modelle“ und je Projekt im Tab „Projekte“ */
const MESSUNG = (() => {
  const strich = '<span class="leer">–</span>';
  const summe = (zeilen, feld = "tokens") => zeilen.reduce((n, z) => n + (z[feld] || 0), 0);
  const prozent = (teil, ganz) => ganz ? Math.round(100 * teil / ganz) : 0;
  const anteil = (teil, ganz) => `<span class="anteil"><span style="width:${prozent(teil, ganz)}%"></span></span> ${prozent(teil, ganz)} %`;
  const aufwand = zeilen => esc([...new Set(zeilen.flatMap(z => z.aufwand))].sort().join(", ")) || strich;
  const sub = zeilen => summe(zeilen.filter(z => z.subagent));
  const tokenKoepfe = '<th class="zahl">Eingabe</th><th class="zahl">Cache geschrieben</th><th class="zahl">Cache gelesen</th><th class="zahl">Ausgabe</th>';
  const tokenZellen = zeilen => ["eingabe", "cache_schreiben", "cache_lesen", "tokens"].map(f => `<td class="zahl">${zahl(summe(zeilen, f))}</td>`).join("");
  // je Modell eine Zeile
  const jeModell = zeilen => [...new Set(zeilen.map(z => z.modell))].map(m => ({ modell: m, zeilen: zeilen.filter(x => x.modell === m) }))
    .sort((a, b) => summe(b.zeilen) - summe(a.zeilen));
  const messung = zeilen => { const ganz = summe(zeilen);
    return `<div class="tabelle"><table><thead><tr><th>Modell</th>${tokenKoepfe}<th>Anteil Ausgabe</th>${je('<th class="zahl">aus Subagenten</th>', "")}<th class="zahl">${je("Antworten", "Turns")}</th><th>Aufwand</th></tr></thead><tbody>${
      jeModell(zeilen).map(m => `<tr><td class="nowrap"><code>${esc(m.modell)}</code></td>${tokenZellen(m.zeilen)}<td class="nowrap">${anteil(summe(m.zeilen), ganz)}</td>
        ${je(`<td class="zahl">${prozent(sub(m.zeilen), summe(m.zeilen))} %</td>`, "")}<td class="zahl">${zahl(summe(m.zeilen, "antworten"))}</td><td>${aufwand(m.zeilen)}</td></tr>`).join("")}</tbody></table></div>`; };
  return { summe, prozent, anteil, sub, tokenKoepfe, tokenZellen, jeModell, messung };
})();

        ["Eingestellt", "Was in den Einstellungen und im Kopf von Agenten, Skills und Befehlen steht."],
        ["Gemessen", "Welches Modell laut Transkripten lief, in Tokens."],
        ["Eingabe", "Neu gelesener Text."], ["Ausgabe", "Das Geschriebene."],
        ["Cache", "Was sich wiederholt: einmal geschrieben, danach nur gelesen."]],
      ["Ein Subagent bekommt sein Modell oft erst beim Aufruf: Das steht in keiner Datei, nur in der Messung. Seine Arbeitsordner zählen zum Projekt.",

        ["Eingestellt", "Die Modell-Schlüssel aus <code>~/.codex/config.toml</code>, auch in Profilen."],
        ["Gemessen", "Welches Modell je Turn lief, in Tokens."],
        ["Eingabe", "Neu gelesener Text."], ["Ausgabe", "Das Geschriebene."], ["Cache", "Was sich wiederholt."]],
      ["Nur Anzeige: Ändern von Hand in der genannten Datei."],
      `<p class="label">Marken</p><ul class="legende"><li>${statusBadge("überschreibt")} <span>das Profil weicht vom globalen Wert ab</span></li></ul>`)));

/* Claudes Zusammenfassung kommt als Markdown: Absätze, Listen, **fett**, `code` */
function markdown(text) {
  const inline = s => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const teile = [];
  let absatz = [], punkte = [], reihen = [];
  const absatzZu = () => { if (absatz.length) teile.push(`<p>${inline(absatz.join(" "))}</p>`); absatz = []; };
  const listeZu = () => { if (punkte.length) teile.push(`<ul>${punkte.map(p => `<li>${inline(p)}</li>`).join("")}</ul>`); punkte = []; };
  const zellen = z => z.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  const tabelleZu = () => {
    if (reihen.length) {
      const [kopf, ...rest] = reihen;
      teile.push(`<div class="tabelle"><table><thead><tr>${kopf.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead>` +
        `<tbody>${rest.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    }
    reihen = [];
  };
  for (const zeile of esc(text).split("\n")) {
    /* Tabellen: ohne sie würde eine Markdown-Tabelle als ein langer Absatz erscheinen */
    const reihe = zeile.trim().startsWith("|") ? zellen(zeile) : null;
    if (reihe && reihe.every(c => /^:?-{2,}:?$/.test(c))) continue; /* Trennzeile unter dem Kopf */
    if (reihe) { absatzZu(); listeZu(); reihen.push(reihe); continue; }
    tabelleZu();
    const punkt = zeile.match(/^\s*[-*]\s+(.*)$/);
    const titel = zeile.match(/^#{1,4}\s+(.*)$/);
    if (titel) { absatzZu(); listeZu(); teile.push(`<h4>${inline(titel[1])}</h4>`); }
    else if (punkt) { absatzZu(); punkte.push(punkt[1]); }
    else if (!zeile.trim()) { absatzZu(); listeZu(); }
    else { listeZu(); absatz.push(zeile.trim()); }
  }
  absatzZu(); listeZu(); tabelleZu();
  return teile.join("");
}
function renderMeldung() {
  const inhalt = meldung ? markdown(meldung) : "";
  const lang = inhalt.length > 2000; /* längere Berichte erst gekürzt zeigen */

    ? `<div class="meldung"><div class="zeile"><p class="label">${esc(meldungTitel)}</p>

       <div class="inhalt${lang ? " gekuerzt" : ""}">${inhalt}</div>
       ${lang ? '<button type="button" class="kopieren" id="meldung-mehr">ganz anzeigen</button>' : ""}
       ${meldungBefehl ? befehlZeile(meldungBefehl) : ""}</div>`

}

    : r.ok ? '<span class="status st-an"><span aria-hidden="true">●</span> erledigt</span>'
    : '<span class="status st-fehler"><span aria-hidden="true">✕</span> Fehler</span>';
  const ausgabe = r?.ausgabe ? `<details${r.ok ? "" : " open"}><summary class="klein">Ausgabe</summary><pre>${esc(r.ausgabe)}</pre></details>` : "";
  return `<button type="button" class="zeilenknopf" data-ausfuehren="${esc(e.id)}"${beschaeftigt || r?.ok ? " disabled" : ""}>ausführen</button>
    <div class="klein">${status}</div>${ausgabe}`;
}
async function api(pfad, daten) {
  try {
    /* X-Harness: Startet der Skill im anderen Harness, während die Seite offen ist, lehnt der Server ab, statt dessen Konfiguration zu ändern */
    const r = await fetch(pfad, { method: "POST", headers: { "X-Token": TOKEN, "X-Harness": D.harness, "Content-Type": "application/json" }, body: daten && JSON.stringify(daten) });
    /* 409 heißt nur: Der Server steht inzwischen auf dem anderen Harness. Kein Fehler des Laufs, die Seite ist veraltet */
    return r.status === 409 ? { ...await r.json(), harnessWechsel: true } : await r.json();
  } catch (_) {
    return { ok: false, verbindung: false, ausgabe: "Keine Antwort vom Server. Läuft python3 server.py noch?" };
  }
}
async function mitSperre(arbeit) {
  beschaeftigt = true; zeichne();
  try { await arbeit(); } finally { beschaeftigt = false; zeichne(); }
}
/* Die Aktion kommt vom Aufrufer, festgehalten beim Klick bzw. bei der Bestätigung: Liest man sie erst hier,
   liefe nach einer Umstellung während der Warteschlange eine Aktion, die niemand bestätigt hat */
async function fuehreAus(e, aktion) {
  ERGEBNIS.set(e.id, { laeuft: true }); zeichne();
  ERGEBNIS.set(e.id, await api("/api/ausfuehren", { id: e.id, aktion }));
}

/* Regeln und Anweisungen stehen nicht in ALLE und laufen nicht über die Warteschlange der Empfehlungen: ein Klick, eine
   eigene Rückfrage mit dem, was sich ändert, dann genau dieser eine Schritt und danach neu einlesen */
function schalte(id, aktion, misslungen) {
  return mitSperre(async () => {
    const r = await api("/api/ausfuehren", { id, aktion });
    if (r.harnessWechsel) return harnessGewechselt(r);
    if (!r.ok) return setMeldung(`${misslungen} fehlgeschlagen:\n\n` + r.ausgabe, "Fehler");
    await neuEinlesen();
  });
}

async function neuEinlesen() {
  setMeldung("Liest den Bestand neu ein …", "Inventar");
  const r = await api("/api/neu");
  if (r.ok) location.reload();
  else if (r.harnessWechsel) harnessGewechselt(r);
  else setMeldung("Neu einlesen fehlgeschlagen:\n\n" + r.ausgabe, "Fehler");
}
/* Nach gelungenen Aktionen stimmt die Seite nicht mehr: Erledigte Zeilen blieben stehen und ließen sich noch einmal
   ausführen. Schlug etwas fehl, bleibt die Seite, damit die Meldung dazu stehen bleibt. Die gespeicherte Wahl
   erledigter Einträge fällt weg, sonst stünde sie nach einem späteren Umschalten wieder vorbelegt da. */
async function nachAktionen(paare) {
  if (!paare.every(([e]) => ERGEBNIS.get(e.id)?.ok)) return;
  paare.forEach(([e]) => delete abweichung[e.id]);
  try { localStorage.setItem(SPEICHER, JSON.stringify(abweichung)); } catch (_) { /* ohne Speicher nichts zu löschen */ }
  await neuEinlesen();
}

    renderSuchInhalt(); /* gibt den Knopf wieder frei */
  });

  /* Laufende oder fertige Claude-Läufe liegen auf dem Server und überstehen so das Neuladen der Seite */
  api("/api/bewertung").then(b => {
    if (b.harnessWechsel) harnessGewechselt(b);
    else if (b.laeuft) mitSperre(bewertungVerfolgen);
    else if ("ok" in b && b.verbindung !== false) bewertungZeigen(b);
    /* erst danach: Bewertung und Prüfung teilen sich die Karte, die Bewertung geht vor */
    if (!b.laeuft && !("ok" in b)) api("/api/pruefung").then(p => {
      if (p.laeuft) pruefungVerfolgen();
      else if ("ok" in p && p.verbindung !== false) pruefungZeigen(p);
    });
  });
  sucheVerfolgen();
}
const warte = ms => new Promise(fertig => setTimeout(fertig, ms));
async function bewertungVerfolgen() {
  for (;;) {
    const b = await api("/api/bewertung");
    /* bewertungLaeuft vor jeder Meldung zurücksetzen, sonst trägt die Fehlerkarte „abbrechen“ statt „schließen“ */
    if (b.verbindung === false) { bewertungLaeuft = false; return setMeldung(b.ausgabe, "Fehler"); }
    if (b.harnessWechsel) { bewertungLaeuft = false; return harnessGewechselt(b); }
    if (!b.laeuft) { bewertungLaeuft = false; return location.reload(); } /* Bewertung und dashboard-claude-code.html sind neu; die Karte zeigt die Seite danach */
    laufArt = "bewertung";
    bewertungLaeuft = b.abgebrochen ? "abbruch" : "ja"; /* der Knopf entsteht alle zwei Sekunden neu und bliebe sonst klickbar */
    setMeldung(`${je("Claude", esc(D.harness_name))} liest den Bestand ein und zieht die Bewertung nach … (${b.sekunden} s)`, "Bewertung läuft");
    await warte(2000);
  }
}
/* Prüfung einer CLAUDE.md (server.pruefen): läuft im Hintergrund, der Bericht bleibt auf dem Server, bis die Karte zugeht */
async function pruefungVerfolgen() {
  for (;;) {
    const b = await api("/api/pruefung");
    if (b.verbindung === false) { bewertungLaeuft = false; return setMeldung(b.ausgabe, "Fehler"); }
    if (b.harnessWechsel) { bewertungLaeuft = false; return harnessGewechselt(b); }
    if (!b.laeuft) { bewertungLaeuft = false; return pruefungZeigen(b); }
    laufArt = "pruefung";
    bewertungLaeuft = b.abgebrochen ? "abbruch" : "ja";
    setMeldung(`Claude prüft \`${kurzPfad(b.datei)}\` … (${b.sekunden} s)`, "Prüfung läuft");
    await warte(2000);
  }
}
const KRITERIEN = { befehle: "Befehle und Abläufe", aufbau: "Aufbau", muster: "Nicht Offensichtliches", knappheit: "Knappheit", aktualitaet: "Aktualität", umsetzbarkeit: "Umsetzbarkeit" };
/* Der Bericht kommt geprüft vom Server (pruefbericht) und geht als Markdown durch markdown(), das zuerst alles escapt.
   Der Befehl zum Umsetzen entsteht hier aus dem Projektpfad, nicht aus Claudes Text. */
function pruefungZeigen(b) {
  offenerLauf = "pruefung";
  if (b.abgebrochen) return setMeldung("Die Prüfung wurde abgebrochen.", "Prüfung abgebrochen");
  if (!b.ok || !b.bericht) return setMeldung("Prüfung fehlgeschlagen:\n\n" + (b.ausgabe || ""), "Fehler bei der Prüfung");
  const r = b.bericht, zelle = s => String(s).replace(/\|/g, "/").replace(/\n/g, " ");
  /* markdown() kennt keine Codeblöcke: Jede Zeile darin wird ein Listenpunkt mit Code, sonst flössen Befehle zu einem Absatz zusammen */
  const ohneZaun = s => { let code = false; return s.split("\n").map(z => {
    if (z.trim().startsWith("\`\`\`")) { code = !code; return ""; }
    return code && z.trim() ? "- \`" + z.replace(/\`/g, "'") + "\`" : z; }).join("\n"); };
  setMeldung([`\`${kurzPfad(b.datei)}\``, "", `## ${r.summe} von 100 · Note ${r.note}`, "", "| Kriterium | Punkte | Befund |", "|---|---|---|",
    ...Object.entries(r.punkte).map(([k, p]) => `| ${KRITERIEN[k] || k} | ${p.punkte}/${p.von} | ${zelle(p.notiz)} |`), "",
    ...(r.probleme.length ? ["## Probleme", "", ...r.probleme.map(p => `- ${zelle(p)}`), ""] : []),
    ...r.vorschlaege.flatMap((v, i) => [`## Vorschlag ${i + 1}`, "", `**Warum:** ${zelle(v.warum)}`, "", ohneZaun(v.text), ""]),
    "## Umsetzen", "", b.befehl
      ? "Die Prüfung ändert nichts. Der Bericht liegt als Datei bereit. Der Befehl unten startet eine Sitzung im Projekt, die die Vorschläge umsetzt, ohne neu zu prüfen: Sie zeigt dir jede Änderung vorher."
      : "Die Prüfung ändert nichts. Zum Umsetzen den Skill claude-md-improver in einer Sitzung im Projekt starten.", /* ohne Berichtsdatei, oder ein Server mit älterem Stand */
  ].join("\n"), "Prüfung der CLAUDE.md", b.befehl || "");
}
function harnessGewechselt(b) {
  seiteVeraltet = true;
  setMeldung(b.ausgabe, "Anderer Harness");
}
function bewertungZeigen(b) {
  offenerLauf = "bewertung";
  if (b.abgebrochen) return setMeldung("Die Bewertung wurde abgebrochen. Die bisherige Bewertung gilt weiter.", "Bewertung abgebrochen");
  setMeldung(b.ok ? b.ausgabe : "Bewertung fehlgeschlagen:\n\n" + b.ausgabe, b.ok ? "Ergebnis der Bewertung" : "Fehler bei der Bewertung");
}
async function sucheVerfolgen() {
  for (;;) {
    suchStand = await api("/api/suche");
    if (!suchStand.laeuft) kandidaten = suchStand.kandidaten || [];
    renderSuchInhalt();
    if (!suchStand.laeuft) return;
    await warte(2000);
  }
}
</script>
