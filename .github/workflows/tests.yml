name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    # 3.11 ist die kleinste unterstützte Version (tomllib); Linux und Mac, weil Papierkorb und Browser je System anders gehen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v
