<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3zero Harness-Inventur</title>
<link rel="icon" href="__ICON__">
<link rel="apple-touch-icon" href="__APPICON__">
<style>
/* Werte aus dem 3zero-Design-Kit (BRAND.md / brand-tokens.css) */
:root {
  --cyan: #00afd0;
  --cyan-dark: #0096b4;
  --cool-gray: #9b9ea0;
  --text: #555555;
  --text-dark: #333333;
  --text-light: #6f6f6f;
  --bg: #ffffff;
  --bg-gray: #f3f3f3;
  --hero: #2a2a2a;
  --border-light: #e0e0e0;
  --cyan-10: rgba(0,175,208,.1);
  --cyan-20: rgba(0,175,208,.2);
  --shadow-nav: 0 1px 4px rgba(0,0,0,.06);
  --shadow-hover: 0 4px 16px rgba(0,0,0,.08);
  --body: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 3px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--body); }
a { color: var(--cyan-dark); }
a:hover { color: var(--cyan); }
code { font: 12.5px/1.4 var(--mono); background: var(--bg-gray); padding: 1px 4px; border-radius: 2px; color: var(--text-dark); overflow-wrap: anywhere; }
h1, h2, h3 { color: var(--text-dark); line-height: 1.3; margin: 0; }

.seitenkopf { position: sticky; top: 0; z-index: 100; }
.hero { background: var(--hero); color: #fff; border-bottom: 3px solid var(--cyan); padding: 14px 30px; }
.hero .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.hero .icon { display: block; flex: none; align-self: flex-start; } /* bündig mit der Oberkante des Schriftzugs, nicht zur höheren Knopfleiste zentriert */
.hero .marke { display: flex; flex-direction: column; gap: 3px; }
.hero .logo { display: block; width: 132px; height: auto; }
.hero h1 { color: var(--cool-gray); font: 600 19px/1.1 var(--body); text-transform: uppercase; letter-spacing: .16em; }
.hero .rechts { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.hero p { margin: 0; color: #d6d6d6; font-size: 12.5px; text-align: right; }
.wrap { margin: 0; } /* linksbündig über die volle Fensterbreite */

nav { background: var(--bg); border-bottom: 1px solid var(--border-light); box-shadow: var(--shadow-nav); padding-inline: 30px; }
nav .wrap { display: flex; flex-wrap: wrap; gap: 4px 22px; padding-block: 12px; }
nav a { position: relative; color: var(--text-dark); text-decoration: none; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 2px; background: var(--cyan); transform: scaleX(0); transition: transform .15s; }
nav a:hover, nav a[aria-current] { color: var(--cyan); }
nav a:hover::after, nav a[aria-current]::after { transform: scaleX(1); }

main { padding-inline: 30px; }
section { padding-block: 24px 8px; scroll-margin-top: var(--kopf, 0px); }
.label { color: var(--cyan); font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; margin: 0 0 6px; }
section > .wrap > h2 { font-size: 22px; font-weight: 400; margin-bottom: 10px; }
.intro { max-width: 760px; margin: 0 0 20px; }
h3 { font-size: 16px; font-weight: 600; }
.klein { font-size: 13px; color: var(--text-light); }

.banner { background: var(--bg-gray); border-left: 3px solid var(--cyan); padding: 14px 20px; margin-top: 28px; font-size: 15px; }
.banner strong { color: var(--text-dark); }
.banner details { margin: 4px 0; }
.banner summary { cursor: pointer; }
.banner details div { margin-top: 4px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 10px; }
.kpi { background: var(--bg-gray); border-radius: var(--radius); padding: 18px 18px 16px; }
.kpi .zahl { color: var(--cyan); font-size: 2rem; font-weight: 700; line-height: 1.1; }
.kpi .zahl small { font-size: 1rem; font-weight: 600; }
.kpi .was { font-size: 13px; color: var(--text); margin-top: 6px; }

.balken { margin-top: 30px; max-width: 760px; }
.balken h3 { margin-bottom: 4px; }
.balken .zeile { display: grid; grid-template-columns: minmax(120px, 230px) 1fr 84px; gap: 12px; align-items: center; padding: 5px 0; font-size: 14px; }
.balken .name { color: var(--text-dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.balken .spur { height: 10px; }
.balken .fuellung { height: 10px; background: var(--cyan); border-radius: 0 2px 2px 0; min-width: 2px; }
.balken .wert { text-align: right; color: var(--text-dark); font-variant-numeric: tabular-nums; }

.tabelle { overflow-x: auto; margin-top: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-light); padding: 8px 10px; border-bottom: 1px solid var(--cool-gray); white-space: nowrap; vertical-align: bottom; }
th.sortierbar { cursor: pointer; user-select: none; }
th.sortierbar:hover { color: var(--cyan-dark); }
td { padding: 9px 10px; border-bottom: 1px solid var(--border-light); vertical-align: top; }
td.name { min-width: 150px; }
td.name strong { color: var(--text-dark); font-weight: 600; overflow-wrap: break-word; }
td.zahl, th.zahl { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.haupt { cursor: pointer; }
tr.haupt:hover td { background: #fafafa; }
tr.offen td { background: var(--bg-gray); border-bottom-color: transparent; }
tr.detail td { background: var(--bg-gray); padding: 4px 10px 18px; }
/* contain: der Inhalt der aufgeklappten Zeile zählt nicht zur Spaltenbreite, sonst verschieben sich beim Aufklappen die Spalten */
.detail dl { display: grid; grid-template-columns: 150px 1fr; gap: 6px 16px; margin: 0; font-size: 13.5px; contain: inline-size; }
.detail dt { color: var(--text-light); }
.detail dd { margin: 0; overflow-wrap: anywhere; }
.nowrap { white-space: nowrap; }

.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 2px; white-space: nowrap; line-height: 1.5; }
.e-entfernen { background: var(--text-dark); color: #fff; border: 1px solid var(--text-dark); }
.e-abschalten { background: #fff; color: var(--text-dark); border: 1px solid var(--text-dark); }
.e-manuell { background: #fff; color: var(--text-dark); border: 1px dashed var(--text-dark); }
.e-pruefen { background: #fff; color: var(--text-dark); border: 1px solid var(--cyan); }
.e-behalten { background: var(--cyan-10); color: var(--text-dark); border: 1px solid var(--cyan-20); }
.e-neu { background: #fff; color: var(--text-light); border: 1px dashed var(--cool-gray); }
.badge .geerbt { font-weight: 400; opacity: .8; }
.status { white-space: nowrap; font-size: 13.5px; }
.st-an span { color: var(--cyan); }
.st-aus { color: var(--text-light); }
.st-teil span { color: var(--cyan); }
.st-fehler { color: var(--text-dark); font-weight: 600; }
.tag { display: inline-block; font-size: 12px; border: 1px solid var(--cool-gray); color: var(--text-light); border-radius: 2px; padding: 0 6px; margin: 2px 4px 0 0; white-space: nowrap; }
.leer { color: var(--text-light); }

.befehl { display: flex; gap: 8px; align-items: flex-start; }
.befehl code { flex: 1; }
button.kopieren, button.zeilenknopf { font: 600 12px var(--body); color: var(--text-dark); background: #fff; border: 1px solid var(--cool-gray); border-radius: 2px; padding: 2px 8px; cursor: pointer; white-space: nowrap; }
button.kopieren:hover, button.zeilenknopf:hover { border-color: var(--cyan); color: var(--cyan-dark); }
.btn { font: 600 14px var(--body); text-transform: uppercase; letter-spacing: .05em; padding: 10px 22px; border-radius: var(--radius); border: 1px solid transparent; cursor: pointer; }
.btn-primary { background: var(--cyan); color: #fff; }
.btn-primary:hover { background: var(--cyan-dark); }
.btn-outline { background: #fff; color: var(--cyan); border-color: var(--cyan); }
.btn-outline:hover { background: var(--cyan); color: #fff; }
button:disabled { opacity: .45; cursor: default; pointer-events: none; }
.aktionsleiste { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.hero .aktionsleiste { margin-left: auto; }
.hero .btn { padding: 7px 14px; font-size: 12.5px; }
.hero .btn-outline { background: transparent; color: #fff; border-color: rgba(255,255,255,.45); }
.hero .btn-outline:hover { background: var(--cyan); border-color: var(--cyan); color: #fff; }

.meldung { background: var(--bg-gray); border-left: 3px solid var(--cyan); padding: 14px 20px 16px; margin-top: 24px; max-width: 900px; font-size: 14.5px; }
.meldung .zeile { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
.meldung .label { margin: 0; }
.meldung p { margin: 0 0 8px; }
.meldung ul { margin: 0 0 8px; padding-left: 18px; }
.meldung li { margin: 3px 0; }
.meldung > :last-child { margin-bottom: 0; }
.meldung h4 { font-size: 15px; font-weight: 600; margin: 14px 0 6px; }
/* Lange Berichte füllten sonst die ganze Seite, bevor man die Tabs wieder sieht */
.meldung .inhalt.gekuerzt { max-height: 50vh; overflow: auto; }
.meldung .inhalt > :last-child { margin-bottom: 0; }
.suchfeld { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; }
.suchfeld textarea { flex: 1 1 320px; max-width: 640px; font: 16px/1.5 var(--body); color: var(--text-dark); border: 1px solid var(--cool-gray); border-radius: var(--radius); padding: 9px 12px; background: #fff; resize: vertical; }
.suchfeld .btn:disabled { opacity: .5; cursor: default; }
/* Dialog: gebaut wie die Service-Card des Brand-Kits, dahinter der Hero-Overlay; ohne Schatten, das Kit kennt sie nur als Hover-Rückmeldung */
dialog.frage { border: 1px solid var(--border-light); border-top: 3px solid var(--cyan); border-radius: var(--radius); padding: 28px 24px; width: min(520px, calc(100vw - 40px)); color: var(--text); }
dialog.frage::backdrop { background: rgba(0,0,0,.52); }
dialog.frage h3 { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
dialog.frage p { margin: 0 0 10px; }
dialog.frage form { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 22px; }
.kandidat { border-top: 1px solid var(--border-light); padding-top: 12px; margin-top: 12px; }
.kandidat .knoepfe { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
select.wahl { font: 13px var(--body); color: var(--text-dark); border: 1px solid var(--cool-gray); border-radius: var(--radius); padding: 3px 6px; background: #fff; }
select.wahl.gesetzt { border-color: var(--cyan); font-weight: 600; }
td details summary { white-space: nowrap; cursor: pointer; }
td details pre { margin: 6px 0 0; font: 12px/1.45 var(--mono); color: var(--text-dark); white-space: pre-wrap; overflow-wrap: anywhere; max-width: 420px; }

.empf-gruppe { margin-top: 30px; }
.empf-gruppe > .kopf { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.empf-gruppe > p { margin: 6px 0 0; font-size: 14px; max-width: 760px; }

.karten { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); gap: 18px; margin-top: 16px; }
.karte { background: #fff; border: 1px solid var(--border-light); border-top: 3px solid var(--cyan); border-radius: var(--radius); padding: 24px 22px; transition: box-shadow .15s; }
.karte:hover { box-shadow: var(--shadow-hover); }
.karte p { font-size: 14.5px; margin: 8px 0 0; }
.karte ul { list-style: none; padding: 0; margin: 14px 0 0; border-top: 1px solid var(--border-light); }
.karte li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border-light); font-size: 13.5px; }
.karte li .links { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; min-width: 0; }
.karte li strong { color: var(--text-dark); font-weight: 600; overflow-wrap: anywhere; }
.karte .fazit { background: var(--bg-gray); padding: 10px 12px; margin-top: 14px; font-size: 14px; border-radius: 2px; }
.karte .fazit b { color: var(--text-dark); }

.filter { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-top: 8px; font-size: 14px; }
.filter input[type=search], .filter select { font: 14px var(--body); color: var(--text-dark); border: 1px solid var(--cool-gray); border-radius: var(--radius); padding: 6px 9px; background: #fff; }
.filter input[type=search] { min-width: 220px; flex: 1 1 220px; max-width: 340px; }
.filter label { display: inline-flex; gap: 6px; align-items: center; }
.filter .anzahl { color: var(--text-light); margin-left: auto; }

.hinweis { margin-top: 16px; }
.hinweis .befehl { margin-top: 10px; }

/* Unterreiter im Stil der Navigation: Versalien, Unterstrich in Cyan */
.unterreiter { display: flex; flex-wrap: wrap; gap: 4px 22px; border-bottom: 1px solid var(--border-light); margin-top: 8px; }
.unterreiter button { position: relative; background: none; border: 0; padding: 10px 0; font: 600 13px var(--body); color: var(--text-dark); text-transform: uppercase; letter-spacing: .05em; cursor: pointer; }
.unterreiter button::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--cyan); transform: scaleX(0); transition: transform .15s; }
.unterreiter button:hover, .unterreiter button[aria-selected="true"] { color: var(--cyan); }
.unterreiter button:hover::after, .unterreiter button[aria-selected="true"]::after { transform: scaleX(1); }
.hilfe [role="tabpanel"] { padding-top: 12px; }
.hilfe ul { margin: 6px 0 0; padding-left: 18px; max-width: 760px; font-size: 14.5px; }
.hilfe li { margin: 5px 0; }

@media (max-width: 640px) {
  .hero { padding: 12px 20px; }
  .hero .btn { padding: 6px 10px; font-size: 11.5px; letter-spacing: .03em; }
  nav, main { padding-inline: 20px; }
  nav .wrap { flex-wrap: nowrap; overflow-x: auto; }
  nav a { white-space: nowrap; }
  .unterreiter { flex-wrap: nowrap; overflow-x: auto; }
  .unterreiter button { white-space: nowrap; }
  .balken .zeile { grid-template-columns: 110px 1fr 70px; }
  .detail dl { grid-template-columns: 1fr; }
  .detail dt { margin-top: 6px; }
}
</style>
</head>
<body>
<div class="seitenkopf">
<header class="hero"><div class="wrap">
  <img class="icon" src="__ICON__" width="52" height="52" alt="" aria-hidden="true">
  <div class="marke"><img class="logo" src="__LOGO__" alt="3zero" width="132" height="24"><h1>Harness-Inventur</h1></div>
  <div class="rechts"><div class="aktionsleiste" id="aktionen"></div><p id="stand"></p></div>
</div></header>
<nav aria-label="Abschnitte"><div class="wrap">
  <a href="#ueberblick">Überblick</a>
  <a href="#empfehlungen">Empfehlungen<span id="zahl-aktionen"></span></a>
  <a href="#ueberschneidungen">Überschneidungen</a>
  <a href="#mcp">MCP-Server</a>
  <a href="#plugins">Plugins</a>
  <a href="#skills">Skills</a>
  <a href="#hooks">Hooks</a>
  <a href="#projekte">Projekte</a>
  <a href="#hinweise">Hinweise</a>
  <a href="#suche">Suche<span id="such-stand"></span></a>
  <a href="#hilfe">Hilfe</a>
</div></nav>
</div>
<main><div id="meldung-bereich"></div><div id="app"></div></main>
<dialog class="frage" id="frage" aria-labelledby="frage-titel"></dialog>

<script id="daten" type="application/json">__DATEN__</script>
<script id="token" type="application/json">null</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("daten").textContent);
/* Setzt server.py beim Ausliefern; als Datei geöffnet bleibt es null und das Dashboard nur lesbar */
const TOKEN = JSON.parse(document.getElementById("token").textContent);

/* Welcher Harness inventarisiert ist: bestimmt Texte, Pfade und ob es Aktionen gibt. Unter Claude Code bleibt alles wie gehabt */
const CODEX = D.harness === "codex";
const je = (claude, codex) => CODEX ? codex : claude;
const NUR_MANUELL = je("nur /", "nur $");
/* Aktionen gibt es nur mit server.py */
const AKTIONEN = !!TOKEN;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const txt = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const datum = s => s ? `${s.slice(8, 10)}.${s.slice(5, 7)}.${s.slice(0, 4)}` : "–";
const zahl = n => Number(n || 0).toLocaleString("de-DE");
const link = (url, text) => /^https:\/\//.test(url || "") ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text || url)}</a>` : esc(text || "");
const kopierKnopf = text => `<button type="button" class="kopieren" data-copy="${esc(text)}">kopieren</button>`;
const befehlZeile = text => `<div class="befehl"><code>${esc(text)}</code>${kopierKnopf(text)}</div>`;

const ALLE = [...D.mcp, ...D.plugins, ...D.skills, ...D.projekt_skills, ...D.projekt_mcp, ...D.hooks];
const INDEX = new Map(ALLE.map(e => [e.id, e]));
const EINGEBAUT = D.eingebaut.map(b => ({ ...b, id: "builtin:" + b.name, typ: "Harness", status: "aktiv", bewertung: { was: b.was }, tokens: b.tokens || 0, quelle: { art: "eingebaut", autor: je("Anthropic", "OpenAI") } }));
EINGEBAUT.forEach(e => INDEX.set(e.id, e));
/* Tab Skills: installierte und eingebaute Skills in einer Liste */
const SKILLS = [...D.skills, ...EINGEBAUT];

const EMPF = {
  "entfernen":   { icon: "✕", cls: "e-entfernen" },
  "abschalten":  { icon: "⊘", cls: "e-abschalten" },
  "nur manuell": { icon: "/", cls: "e-manuell" },
  "prüfen":      { icon: "?", cls: "e-pruefen" },
  "behalten":    { icon: "✓", cls: "e-behalten" },
};
/* Plugin-Bestandteile ohne eigene Empfehlung übernehmen die ihres Plugins */
function wirksam(e) {
  if (e.bewertung?.empfehlung) return { empfehlung: e.bewertung.empfehlung, geerbt: false };
  const pid = e.plugin ? "plugin:" + e.plugin : (e.id?.startsWith("mcp:") && e.art === "Plugin") ? "plugin:" + e.quelle : null;
  const p = pid && INDEX.get(pid);
  return p?.bewertung?.empfehlung ? { empfehlung: p.bewertung.empfehlung, geerbt: true } : null;
}
function empfBadge(e) {
  if (e.typ === "Harness") return '<span class="leer">–</span>';
  if (!e.bewertung) return '<span class="badge e-neu">neu · unbewertet</span>';
  const w = wirksam(e);
  const k = w && EMPF[w.empfehlung];
  if (!k) return '<span class="leer">–</span>';
  return `<span class="badge ${k.cls}"><span aria-hidden="true">${k.icon}</span>${esc(w.empfehlung)}${w.geerbt ? '<span class="geerbt">· Plugin</span>' : ""}</span>`;
}
const STATUS = {
  "aktiv": ["●", "an"], "verbunden": ["●", "an"], "freigegeben": ["●", "an"], "eingetragen": ["●", "an"], "wartet auf Freigabe": ["◐", "teil"],
  "aus": ["○", "aus"], "deaktiviert": ["○", "aus"], "nicht aktiviert": ["○", "aus"], "inaktiv (Plugin aus)": ["○", "aus"],
  "abgelehnt": ["○", "aus"], "Ordner fehlt": ["○", "aus"],
  "Fehler": ["✕", "fehler"], "Anmeldung nötig": ["!", "fehler"],
  "wirkungslos": ["○", "aus"], "nicht vertraut": ["○", "aus"], "im Konto": ["◐", "teil"],
};
function statusBadge(s) {
  const [icon, cls] = STATUS[s] || ["?", "aus"];
  return `<span class="status st-${cls}"><span aria-hidden="true">${icon}</span> ${esc(s)}</span>`;
}
function nutzungText(e) {
  if (e.typ === "Agent" || e.typ === "Hook") return '<span class="leer">nicht erfasst</span>';
  if (e.id.startsWith("mcp:") && (!CODEX || !("nutzung" in e))) return '<span class="leer">nicht erfasst</span>';
  if (e.id.startsWith("plugin:") && !e.skills.length && !e.befehle.length) return '<span class="leer">–</span>';
  const n = e.nutzung;
  return n ? `${zahl(n.anzahl)}× <span class="klein">· ${datum(n.zuletzt)}</span>` : '<span class="leer">nie</span>';
}
const was = e => e.bewertung?.was ? txt(e.bewertung.was) : `<span class="klein">${esc(e.beschreibung || "")}</span>`;
function quelleText(e) {
  if (e.id.startsWith("plugin:")) return esc(e.autor);
  if (e.id.startsWith("mcp:")) return esc(e.art);
  return esc(e.quelle?.autor || "");
}
/* Herkunft in den Skill-Tabellen: wie der Skill auf den Rechner kam, also auch, wie er wieder geht. Der Autor steht in der Detailzeile */
function lieferweg(s) {
  if (s.plugin) return `Plugin ${s.plugin.split("@")[0]}`;
  if (s.typ === "Harness") return je("Anthropic/Claude Code", "OpenAI/Codex");
  /* Besitzer lesbar über `autoren` in der Bewertungsdatei, der GitHub-Pfad steht in der Detailzeile */
  if (s.quelle.repo) return `${s.quelle.autor}/${s.quelle.repo.split("/")[1]}`;
  if (s.projekt) return "im Projekt";
  return s.quelle.art === "Symlink" ? "eigen" : "unbekannt";
}
const autor = s => s.plugin ? INDEX.get("plugin:" + s.plugin)?.autor : s.quelle.autor;
function typText(e) {
  if (e.id.startsWith("plugin:")) return "Plugin";
  const typ = e.id.startsWith("mcp:") ? "MCP-Server" : e.typ;
  return e.projekt ? `${typ} in ${e.projekt.split("/").pop()}` : typ;
}

/* Kontextlast je Sitzung: automatisch geladene Beschreibungen und was SessionStart-Hooks einspielen.
   Projekt-Skills laden nur in ihrem Projekt und zählen nicht mit. Dazu, was wegfällt, wenn alle Empfehlungen außer „prüfen" umgesetzt sind */
const SPAREN = ["entfernen", "abschalten", "nur manuell"];
/* Abschalten und „nur manuell“ lassen sich schon an der Konfiguration ablesen; Entfernte stehen gar nicht mehr im Bestand */
const umgesetzt = e => ({ "abschalten": e.override === "off" || (CODEX && e.status === "aus"), "nur manuell": e.aufruf === NUR_MANUELL })[e.bewertung?.empfehlung] || false;
const JE_SITZUNG = [...D.skills, ...D.hooks, ...EINGEBAUT];
const tokensGesamt = JE_SITZUNG.reduce((s, e) => s + e.tokens, 0);
const tokensSparen = ALLE.reduce((s, e) => SPAREN.includes(e.bewertung?.empfehlung) && !e.projekt ? s + (e.tokens || 0) : s, 0);

/* Auswahl der Aktionen (nur mit server.py): vorbelegt aus der eigenen Empfehlung, Abweichungen merkt sich der Browser */
const STANDARD = { "entfernen": "deinstallieren", "abschalten": "deaktivieren", "nur manuell": "nur manuell" };
const REIHENFOLGE = ["aktualisieren", "deinstallieren", "deaktivieren", "nur manuell"];
const SPEICHER = "3zero-harness-inventur:auswahl";
let abweichung = {};
try { abweichung = JSON.parse(localStorage.getItem(SPEICHER)) || {}; } catch (_) { /* ohne Speicher gilt die Vorbelegung */ }
function gewaehlt(e) {
  const a = e.id in abweichung ? abweichung[e.id] : STANDARD[e.bewertung?.empfehlung];
  return a && e.aktionen?.[a] ? a : "";
}
function waehle(id, a) {
  const e = INDEX.get(id);
  if (a === (STANDARD[e.bewertung?.empfehlung] || "")) delete abweichung[id];
  else abweichung[id] = a;
  try { localStorage.setItem(SPEICHER, JSON.stringify(abweichung)); } catch (_) { /* dito */ }
}
function befehlText(e, a) {
  const s = e.aktionen[a];
  if (s.override) return `~/.claude/settings.json → "skillOverrides": {"${e.name}": "${s.override}"}`;
  if (s.sperren) return `~/.claude/settings.json → "deniedMcpServers": [${JSON.stringify(s.sperren)}]`;
  if (s.toml) return `~/.codex/config.toml → [${s.toml.tabelle}] ${s.toml.schluessel} = ${s.toml.wert}`;
  if (s.skill_aus) return `~/.codex/config.toml → [[skills.config]] path = ${JSON.stringify(s.skill_aus)}, enabled = false`;
  if (s.nur_manuell) return `${s.nur_manuell}/agents/openai.yaml → policy: allow_implicit_invocation: false`;
  const argv = s.argv.map(x => /^[\w@%+=:,./-]+$/.test(x) ? x : `"${x}"`).join(" ");
  return s.cwd ? `cd "${s.cwd}" && ${argv}` : argv;
}
/* Was der Benutzer vor dem Ausführen wissen sollte: Trifft der Schritt die gemeinsame Quelle (npx skills remove
   oder ein Pfad unter ~/.agents/skills), verschwindet der Skill in beiden Harnesses; agents/openai.yaml liegt
   im Skill-Ordner, den ein Update überschreibt */
function warnung(e, a) {
  if (a === "deinstallieren" && e.aktionen?.[a]?.gemeinsam) return `Entfernt ${e.name} auch aus ${je("Codex", "Claude Code")}.`;
  if (a === "nur manuell" && CODEX) return "Die Datei liegt im Skill-Ordner und geht beim nächsten Update des Skills verloren.";
  return "";
}
const SP = AKTIONEN ? 1 : 0; /* zusätzliche Spalte „Aktion“ */
const WAHL_KOPF = AKTIONEN ? "<th>Aktion</th>" : "";
function wahlFeld(e) {
  const namen = Object.keys(e.aktionen || {});
  if (!namen.length) return '<span class="leer">–</span>';
  const g = gewaehlt(e);
  return `<select class="wahl${g ? " gesetzt" : ""}" data-wahl="${esc(e.id)}" aria-label="Aktion für ${esc(e.name)}">
    <option value="">keine</option>${namen.map(a => `<option${a === g ? " selected" : ""}>${a}</option>`).join("")}</select>`;
}
const wahlZelle = e => AKTIONEN ? `<td>${wahlFeld(e)}</td>` : "";

function abschnitt(id, titel, inhalt, intro) {
  return `<section id="${id}"><div class="wrap"><h2>${esc(titel)}</h2>${intro ? `<p class="intro">${intro}</p>` : ""}${inhalt}</div></section>`;
}

function renderUeberblick() {
  const mcpAn = D.mcp.filter(m => m.status === je("verbunden", "aktiv")).length;
  const plAn = D.plugins.filter(p => p.status === "aktiv").length;
  const skAn = D.skills.filter(s => s.status === "aktiv").length;
  const zaehle = t => ALLE.filter(e => e.bewertung?.empfehlung === t && !umgesetzt(e)).length;
  const banner = [];
  /* Nach einem frischen Bestand sind das schnell über hundert IDs; ausgeschrieben füllen sie den halben Bildschirm */
  const idListe = ids => ids.length <= 6 ? ` ${ids.map(esc).join(", ")}.`
    : `<details><summary class="klein">alle ${ids.length} anzeigen</summary><div class="klein">${ids.map(esc).join(", ")}</div></details>`;
  if (D.unbewertet.length) banner.push(`<strong>${D.unbewertet.length} Einträge sind neu und noch nicht bewertet:</strong>${idListe(D.unbewertet)}`);
  if (D.entfallen.length) banner.push(`<strong>${D.entfallen.length} bewertete Einträge sind nicht mehr installiert:</strong>${idListe(D.entfallen)}`);
  if (D.live_status === false) banner.push("<strong>MCP-Status nur aus der Konfiguration:</strong> <code>claude mcp list</code> war beim Erstellen nicht erreichbar.");
  const bannerHtml = banner.length ? `<div class="banner">${banner.join("<br>")}<br>Führe in ${esc(D.harness_name)} <code>${je("/", "$")}3zero-harness-inventur</code> aus, um die Bewertung nachzuziehen.</div>` : "";

  const kpis = `<div class="kpis">
    <div class="kpi"><div class="zahl">${mcpAn}<small> / ${D.mcp.length}</small></div><div class="was">MCP-Server ${je("verbunden", "aktiv")} / eingetragen</div></div>
    <div class="kpi"><div class="zahl">${plAn}<small> / ${D.plugins.length}</small></div><div class="was">Plugins aktiv / installiert</div></div>
    <div class="kpi"><div class="zahl">${skAn}<small> / ${D.skills.length}</small></div><div class="was">Skills, Befehle, Agenten aktiv / gesamt</div></div>
    <div class="kpi"><div class="zahl">≈ ${zahl(tokensGesamt)}</div><div class="was">Tokens je Sitzung für automatisch geladene Beschreibungen und SessionStart-Hooks</div></div>
    <div class="kpi"><div class="zahl">${zaehle("entfernen")}</div><div class="was">Empfehlungen zum Entfernen, dazu ${zaehle("abschalten") + zaehle("nur manuell")} zum Abschalten, ${zaehle("prüfen")} zum Prüfen</div></div>
    <div class="kpi"><div class="zahl">− ${zahl(tokensSparen)}</div><div class="was">Tokens je Sitzung nach Umsetzung (ohne „prüfen“)</div></div>
  </div>`;

  const summen = new Map();
  JE_SITZUNG.filter(e => e.tokens > 0).forEach(e => {
    const k = e.plugin ? `Plugin ${e.plugin.split("@")[0]}` : (e.quelle?.autor || "unbekannt");
    const v = summen.get(k) || { tokens: 0, anzahl: 0 };
    v.tokens += e.tokens; v.anzahl += 1; summen.set(k, v);
  });
  const reihen = [...summen.entries()].sort((a, b) => b[1].tokens - a[1].tokens);
  const max = reihen.length ? reihen[0][1].tokens : 1;
  const balken = `<div class="balken"><h3>Kontextlast nach Herkunft</h3>
    <p class="klein" style="margin:0 0 10px">Beschreibungen, die ${esc(D.harness_name)} in jede Sitzung lädt, und Text, den SessionStart-Hooks einspielen (grob geschätzt: Zeichen ÷ 4). Skills mit „${NUR_MANUELL}“ kosten nichts.</p>
    ${reihen.map(([k, v]) => `<div class="zeile" title="${esc(k)}: ${v.anzahl} Einträge, ≈ ${zahl(v.tokens)} Tokens">
      <span class="name">${esc(k)}</span>
      <span class="spur"><span class="fuellung" style="display:block;width:${(v.tokens / max * 100).toFixed(1)}%"></span></span>
      <span class="wert">≈ ${zahl(v.tokens)}</span></div>`).join("")}
  </div>`;
  return abschnitt("ueberblick", "Was installiert ist und was es kostet", bannerHtml + kpis + balken);
}

/* Empfehlungen: was der Eintrag tut, warum die Empfehlung so lautet, und die Umsetzung in derselben Zeile */
const GRUPPEN_TEXT = {
  "entfernen": "Deinstallieren. Alles lässt sich bei Bedarf wieder installieren.",
  "abschalten": je("Einzelne Skills aus einem Plugin, das bleibt. Abschalten per skillOverrides in ~/.claude/settings.json.",
    "Einzelne Skills, die bleiben, aber nicht laden sollen. Abschalten per [[skills.config]] in ~/.codex/config.toml."),
  "nur manuell": je("Bleiben per /name erreichbar, laden ihre Beschreibung aber nicht mehr in jede Sitzung.",
    "Bleiben per $name erreichbar, laden ihre Beschreibung aber nicht mehr in jede Sitzung (agents/openai.yaml)."),
  "prüfen": "Hier fehlt deine Entscheidung. Der Befehl zeigt, wie das Entfernen ginge.",
  "selbst gewählt": "Ohne offene Empfehlung, von dir in den Bestandstabellen gewählt.",
};
function renderEmpfehlungen() {
  return abschnitt("empfehlungen", "Was weg kann und was du entscheiden solltest",
    '<div id="empf-inhalt"></div>',
    "Die Empfehlungen stützen sich auf Nutzungszahlen, Überschneidungen und den Inhalt der Skills." +
    (AKTIONEN ? ` Wähle in der Spalte „Aktion“, was geschehen soll, und starte es je Zeile oder alles zusammen. Wirksam ab der nächsten ${je("Claude-Code", esc(D.harness_name))}-Sitzung.`
      : " Nichts wird automatisch geändert."));
}
function empfZeile(e) {
  const a = gewaehlt(e);
  const befehl = a ? `<div class="klein" style="margin-top:5px"><code>${esc(befehlText(e, a))}</code>${warnung(e, a) ? `<div>${esc(warnung(e, a))}</div>` : ""}</div>` : befehlZeile(e.befehl);
  return `<tr><td class="name" style="min-width:170px"><strong>${esc(e.name)}</strong><div class="klein">${typText(e)} · ${quelleText(e)}</div></td>
    <td style="min-width:220px">${was(e)}</td>
    <td style="min-width:220px">${txt(e.bewertung?.grund || "")}</td>
    <td style="min-width:250px">${AKTIONEN ? wahlFeld(e) + befehl : befehlZeile(e.befehl)}</td>
    ${AKTIONEN ? `<td>${ausfuehrZelle(e)}</td>` : ""}</tr>`;
}
function renderEmpfInhalt() {
  let html = "";
  const typen = ["entfernen", "abschalten", "nur manuell", "prüfen"];
  const offen = e => typen.includes(e.bewertung?.empfehlung) && !umgesetzt(e);
  const gruppen = typen.map(typ => [typ, ALLE.filter(e => e.bewertung?.empfehlung === typ && offen(e))]);
  /* alles mit Aktion, das in keiner der Empfehlungsgruppen steht */
  gruppen.push(["selbst gewählt", ALLE.filter(e => gewaehlt(e) && !offen(e))]);
  for (const [typ, roh] of gruppen) {
    const liste = roh.sort((a, b) => a.name.localeCompare(b.name));
    if (!liste.length) continue;
    const shell = liste.map(e => e.befehl).filter(b => !b.includes("→"));
    const alle = shell.length > 1 && (typ === "entfernen" || typ === "prüfen")
      ? `<button type="button" class="kopieren" data-copy="${esc(shell.join("\n"))}">alle ${shell.length} Befehle kopieren</button>` : "";
    html += `<div class="empf-gruppe"><div class="kopf"><h3>${typ === "selbst gewählt" ? '<span class="badge e-neu">selbst gewählt</span>' : empfBadge({ bewertung: { empfehlung: typ } })} ${liste.length} Einträge</h3>${alle}</div>
      <p>${GRUPPEN_TEXT[typ]}</p>
      <div class="tabelle"><table><thead><tr><th>Name</th><th>Was es macht</th><th>Warum</th><th>${AKTIONEN ? "Aktion" : "Befehl"}</th>${AKTIONEN ? "<th>Ausführen</th>" : ""}</tr></thead>
      <tbody>${liste.map(empfZeile).join("")}</tbody></table></div></div>`;
  }
  const erledigt = ALLE.filter(umgesetzt).map(e => e.name).sort((a, b) => a.localeCompare(b));
  if (erledigt.length) html += `<p class="klein">Schon umgesetzt: ${erledigt.map(esc).join(", ")}.</p>`;
  document.getElementById("empf-inhalt").innerHTML = html || '<p class="leer">Keine offenen Empfehlungen.</p>';
  if (TOKEN) {
    const offen = warteschlange().filter(e => !ERGEBNIS.get(e.id)?.ok).length;
    document.getElementById("zahl-aktionen").textContent = offen ? ` (${offen})` : "";
  }
}

function renderGruppen() {
  const karten = D.gruppen.map(g => {
    const zeilen = g.mitglieder.map(id => {
      const e = INDEX.get(id);
      if (!e) return `<li><span class="links"><strong>${esc(id)}</strong><span class="klein">nicht mehr vorhanden</span></span></li>`;
      return `<li><span class="links"><strong>${esc(e.name)}</strong><span class="klein">${typText(e)} · ${quelleText(e)}</span></span>
        <span class="links"><span class="klein">${nutzungText(e)}</span>${statusBadge(e.status)}${empfBadge(e)}</span></li>`;
    }).join("");
    return `<article class="karte"><h3>${esc(g.titel)}</h3><p>${txt(g.einschaetzung)}</p><ul>${zeilen}</ul>
      <div class="fazit"><b>Empfehlung:</b> ${txt(g.empfehlung)}</div></article>`;
  }).join("");
  return abschnitt("ueberschneidungen", `${D.gruppen.length} Bereiche mit mehreren Werkzeugen für dieselbe Aufgabe`,
    `<div class="karten">${karten}</div>`);
}

function detailZeile(spalten, paare) {
  const dl = paare.filter(([, v]) => v).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("");
  return `<tr class="detail" hidden><td colspan="${spalten}"><dl>${dl}</dl></td></tr>`;
}

function renderMcp() {
  const ausIn = n => n ? ` <span class="klein">· aus in ${n} ${n === 1 ? "Projekt" : "Projekten"}</span>` : "";
  const zeilen = D.mcp.map(m => `<tr class="haupt"><td class="name"><strong>${esc(m.name)}</strong></td>
      <td>${esc(m.art)}</td><td>${statusBadge(m.status)}${ausIn(m.aus_in_projekten.length)}</td><td>${was(m)}</td><td>${empfBadge(m)}</td>${wahlZelle(m)}</tr>` +
    detailZeile(5 + SP, [
      ["Ziel", m.ziel ? `<code>${esc(m.ziel)}</code>` : ""],
      ["Quelle", esc(m.quelle)],
      ["Genutzt", CODEX ? nutzungText(m) : ""],
      ["Abgeschaltet in", m.aus_in_projekten.length ? m.aus_in_projekten.map(esc).join("<br>") : ""],
      ["Begründung", txt(m.bewertung?.grund || "")],
      ["Entfernen", befehlZeile(m.befehl)],
    ])).join("");
  return abschnitt("mcp", "Global eingetragene Server und ihr Status",
    `<div class="tabelle"><table><thead><tr><th>Name</th><th>Art</th><th>Status</th><th>Was er macht</th><th>Empfehlung</th>${WAHL_KOPF}</tr></thead><tbody>${zeilen}</tbody></table></div>`,
    je("Global eingetragene Server; was nur in einem Projekt gilt, steht unter Projekte. Status laut <code>claude mcp list</code>, abgefragt aus einem Ordner ohne Projekt-Abschaltungen. " +
      "„deaktivieren“ sperrt einen Server per <code>deniedMcpServers</code> in <code>~/.claude/settings.json</code> für alle Projekte. Zeile anklicken für Details.",
      "Global eingetragene Server aus <code>~/.codex/config.toml</code> und den Plugins; was nur in einem Projekt gilt, steht unter Projekte. Status aus der Konfiguration (<code>enabled</code>), ohne Verbindungstest. " +
      "„Genutzt“ in den Details zählt MCP-Aufrufe in den Codex-Sitzungen. Zeile anklicken für Details."));
}

/* Skills-Tabelle mit Filter und Sortierung */
const F = { suche: "", quelle: "", status: "", aufruf: "", empf: "", geteilt: "", teile: true, sort: "name", richtung: 1 };
/* Skills aus ~/.agents/skills liegen für beide Harnesses im selben Ordner und laden deshalb in beiden */

    .map(([k, t, c]) => `<th class="${k ? "sortierbar" : ""} ${c || ""}" ${k ? `data-sort="${k}"` : ""}>${t}${k ? " ↕" : ""}</th>`).join("") + WAHL_KOPF;

function skillsFiltern() {
  const q = F.suche.toLowerCase();
  const liste = SKILLS.filter(s => {
    const empf = s.bewertung ? (wirksam(s)?.empfehlung || "keine") : "unbewertet";
    return (F.teile || !s.plugin)
      && (!q || `${s.name} ${s.beschreibung} ${s.bewertung?.was || ""}`.toLowerCase().includes(q))
      && (!F.quelle || lieferweg(s) === F.quelle)
      && (!F.status || (F.status === "Update verfügbar" ? s.update : s.status === F.status))
      && (!F.aufruf || s.aufruf === F.aufruf)
      && (!F.empf || empf === F.empf)
      && (!F.geteilt || (F.geteilt === GETEILT ? !!s.geteilt : !s.geteilt));
  });
  const wert = s => F.sort === "tokens" ? s.tokens : F.sort === "nutzung" ? (s.nutzung?.anzahl || 0) : s.name.toLowerCase();
  liste.sort((a, b) => (wert(a) > wert(b) ? 1 : wert(a) < wert(b) ? -1 : 0) * F.richtung);
  document.getElementById("f-anzahl").textContent = `${liste.length} von ${SKILLS.length}`;
  document.getElementById("skills-body").innerHTML = liste.map(s => {
    const kontext = s.tokens ? `≈ ${zahl(s.tokens)}` : '<span class="leer">–</span>';
    return `<tr class="haupt"><td class="name"><strong>${esc(s.name)}</strong><div class="klein">${esc(s.typ)}${s.status === "aus" ? " · aus" : ""}</div>
        ${s.reife ? `<span class="tag">${esc(s.reife)}</span>` : ""}${s.update ? '<span class="tag">Update verfügbar</span>' : ""}${s.geteilt ? `<span class="tag">${esc(GETEILT)}</span>` : ""}</td>
      <td>${esc(lieferweg(s))}</td><td class="nowrap klein">${s.aufruf ? esc(s.aufruf) : '<span class="leer">–</span>'}</td><td class="zahl">${kontext}</td>
      <td class="zahl">${nutzungText(s)}</td><td>${was(s)}</td><td>${empfBadge(s)}</td>${wahlZelle(s)}</tr>` +
      detailZeile(7 + SP, [

        ["Begründung", txt(s.bewertung?.grund || "")],
        ["Autor", esc(autor(s))],
        ["Quelle", s.quelle.url ? link(s.quelle.url, s.quelle.repo || s.quelle.url) : esc(s.quelle.repo || s.quelle.art)],
        ["Upstream-Status", s.reife ? esc(s.reife) + " (laut Ordner im Quell-Repo)" : ""],

}

/* Claudes Zusammenfassung kommt als Markdown: Absätze, Listen, **fett**, `code` */
function markdown(text) {
  const inline = s => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const teile = [];
  let absatz = [], punkte = [], reihen = [];
  const absatzZu = () => { if (absatz.length) teile.push(`<p>${inline(absatz.join(" "))}</p>`); absatz = []; };
  const listeZu = () => { if (punkte.length) teile.push(`<ul>${punkte.map(p => `<li>${inline(p)}</li>`).join("")}</ul>`); punkte = []; };
  const zellen = z => z.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  const tabelleZu = () => {
    if (reihen.length) {
      const [kopf, ...rest] = reihen;
      teile.push(`<div class="tabelle"><table><thead><tr>${kopf.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead>` +
        `<tbody>${rest.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    }
    reihen = [];
  };
  for (const zeile of esc(text).split("\n")) {
    /* Tabellen: ohne sie würde eine Markdown-Tabelle als ein langer Absatz erscheinen */
    const reihe = zeile.trim().startsWith("|") ? zellen(zeile) : null;
    if (reihe && reihe.every(c => /^:?-{2,}:?$/.test(c))) continue; /* Trennzeile unter dem Kopf */
    if (reihe) { absatzZu(); listeZu(); reihen.push(reihe); continue; }
    tabelleZu();
    const punkt = zeile.match(/^\s*[-*]\s+(.*)$/);
    const titel = zeile.match(/^#{1,4}\s+(.*)$/);
    if (titel) { absatzZu(); listeZu(); teile.push(`<h4>${inline(titel[1])}</h4>`); }
    else if (punkt) { absatzZu(); punkte.push(punkt[1]); }
    else if (!zeile.trim()) { absatzZu(); listeZu(); }
    else { listeZu(); absatz.push(zeile.trim()); }
  }
  absatzZu(); listeZu(); tabelleZu();
  return teile.join("");
}

function kopiere(text, knopf) {
  const fertig = () => { const alt = knopf.textContent; knopf.textContent = "kopiert"; setTimeout(() => { knopf.textContent = alt; }, 1400); };
  const notweg = () => {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); fertig(); } catch (_) { /* Kopieren nicht möglich, Text bleibt markierbar */ }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(fertig, notweg);
  else notweg();
}

      if (!await frage(`${k.name} installieren?`, `${ART[k.art]} ${k.name}${manuell ? " wird installiert und auf „nur manuell“ gestellt" : " wird installiert"}. Er läuft danach mit deinen vollen Rechten.\n\nWirksam ab der nächsten ${je("Claude-Code", D.harness_name)}-Sitzung.`, manuell ? "installieren, nur manuell" : "installieren")) return;
      mitSperre(async () => {
        INSTALLATION.set(nr, { laeuft: true }); renderSuchInhalt();
        const r = await api("/api/installieren", { nr, nur_manuell: manuell });
        INSTALLATION.set(nr, r);
        if (!r.ok) return;
        const neu = await api("/api/neu");
        if (!neu.ok) return setMeldung("Neu einlesen fehlgeschlagen:\n\n" + neu.ausgabe, "Fehler");
        location.reload(); /* der Tab holt sich die Suche danach vom Server zurück, mit „installiert“ am Kandidaten */
      });
    } else {
      mitSperre(() => fuehreAus(INDEX.get(knopf.dataset.ausfuehren)));
    }
  });

  document.getElementById("suchform").addEventListener("submit", async ev => {
    ev.preventDefault();
    const bedarf = document.getElementById("bedarf").value.trim();
    if (!bedarf) return;
    kandidaten = []; INSTALLATION.clear();
    const r = await api("/api/suchen", { bedarf });
    if (r.ok) return sucheVerfolgen();
    suchStand = { ...r, laeuft: false, bedarf };
    renderSuchInhalt();
  });

  /* Laufende oder fertige Claude-Läufe liegen auf dem Server und überstehen so das Neuladen der Seite */
  api("/api/bewertung").then(b => {
    if (b.laeuft) mitSperre(bewertungVerfolgen);
    else if ("ok" in b && b.verbindung !== false) bewertungZeigen(b);
  });
  sucheVerfolgen();
}
const warte = ms => new Promise(fertig => setTimeout(fertig, ms));
async function bewertungVerfolgen() {
  for (;;) {
    const b = await api("/api/bewertung");
    if (b.verbindung === false) return setMeldung(b.ausgabe, "Fehler");
    if (!b.laeuft) return location.reload(); /* Bewertung und dashboard.html sind neu; die Karte zeigt die Seite danach */
    setMeldung(`${je("Claude", esc(D.harness_name))} liest den Bestand ein und zieht die Bewertung nach … (${b.sekunden} s)`, "Bewertung läuft");
    await warte(2000);
  }
}
function bewertungZeigen(b) {
  offenerLauf = "bewertung";
  setMeldung(b.ok ? b.ausgabe : "Bewertung fehlgeschlagen:\n\n" + b.ausgabe, b.ok ? "Ergebnis der Bewertung" : "Fehler bei der Bewertung");
}
async function sucheVerfolgen() {
  for (;;) {
    suchStand = await api("/api/suche");
    if (!suchStand.laeuft) kandidaten = suchStand.kandidaten || [];
    renderSuchInhalt();
    if (!suchStand.laeuft) return;
    await warte(2000);
  }
}
</script>
