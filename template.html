<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3zero Harness-Inventur</title>
<link rel="icon" href="__ICON__">
<link rel="apple-touch-icon" href="__APPICON__">
<style>
/* Werte aus dem 3zero-Design-Kit (BRAND.md / brand-tokens.css).
   Das Kit kennt keine dunkle Palette. Seine einzige dunkle Fläche ist --hero (#2a2a2a); die trägt hier die Karten.
   Nur drei Werte sind abgeleitet und stehen so nicht im Kit: Seitengrund, Linien und die Zeile unter dem Mauszeiger.
   light-dark() nimmt den zweiten Wert, sobald color-scheme dunkel ist — der Knopf im Kopf schaltet nur das um. */
:root {
  color-scheme: light dark;
  --cyan: #00afd0;
  --cyan-dark: light-dark(#0096b4, #00afd0);
  --cool-gray: #9b9ea0;
  --text: light-dark(#555555, #e0e0e0);
  --text-dark: light-dark(#333333, #ffffff);
  --text-light: light-dark(#6f6f6f, #9b9ea0);
  --bg: light-dark(#ffffff, #1f1f1f);
  --bg-gray: light-dark(#f3f3f3, #2a2a2a);
  --bg-hover: light-dark(#fafafa, #262626);
  --hero: #2a2a2a;
  --border-light: light-dark(#e0e0e0, #3d3d3d);
  --cyan-10: rgba(0,175,208,.1);
  --cyan-20: rgba(0,175,208,.2);
  --schatten: light-dark(rgba(0,0,0,.06), rgba(0,0,0,.45));
  --schatten-stark: light-dark(rgba(0,0,0,.08), rgba(0,0,0,.5));
  --shadow-nav: 0 1px 4px var(--schatten);
  --shadow-hover: 0 4px 16px var(--schatten-stark);
  --body: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 3px;
}
:root[data-thema="hell"] { color-scheme: light; }
:root[data-thema="dunkel"] { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--body); }
a { color: var(--cyan-dark); }
a:hover { color: var(--cyan); }
code { font: 12.5px/1.4 var(--mono); background: var(--bg-gray); padding: 1px 4px; border-radius: 2px; color: var(--text-dark); overflow-wrap: anywhere; }
h1, h2, h3 { color: var(--text-dark); line-height: 1.3; margin: 0; }

.seitenkopf { position: sticky; top: 0; z-index: 100; }
.hero { background: var(--hero); color: #fff; border-bottom: 3px solid var(--cyan); padding: 14px 30px; }
.hero .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.hero .icon { display: block; flex: none; align-self: flex-start; } /* bündig mit der Oberkante des Schriftzugs, nicht zur höheren Knopfleiste zentriert */
.hero .marke { display: flex; flex-direction: column; gap: 3px; }
/* Titel, Marke und Harness-Name mittig zueinander, trotz 19px gegen 15px Schriftgröße */
.hero .titelzeile { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 16px; }
.hero .logo { display: block; width: 132px; height: auto; }
.hero h1 { color: var(--cool-gray); font: 600 19px/1.1 var(--body); text-transform: uppercase; letter-spacing: .16em; }
.hero .rechts { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.hero p { margin: 0; color: #d6d6d6; font-size: 12.5px; }
.hero .marke p { display: flex; align-items: center; gap: 8px; font-size: 15px; color: #e4e4e4; }
.harness-marke { flex: none; width: 17px; height: 17px; }
/* Knopf und seine Zeitangabe sind eine Einheit und brechen zusammen um */
.knopfstapel { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.knopfstapel .zeit { color: #b4b4b4; font-size: 11.5px; white-space: nowrap; }
.knopfstapel.nur-zeit { align-items: flex-end; } /* ohne Knöpfe darüber: rechtsbündig neben dem Darstellungsknopf */
.wrap { margin: 0; } /* linksbündig über die volle Fensterbreite */

nav { background: var(--bg); border-bottom: 1px solid var(--border-light); box-shadow: var(--shadow-nav); padding-inline: 30px; }
nav .wrap { display: flex; flex-wrap: wrap; gap: 4px 22px; padding-block: 12px; }
nav a { position: relative; color: var(--text-dark); text-decoration: none; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 2px; background: var(--cyan); transform: scaleX(0); transition: transform .15s; }
nav a:hover, nav a[aria-current] { color: var(--cyan); }
nav a:hover::after, nav a[aria-current]::after { transform: scaleX(1); }
/* zweite Ebene: die Tabs der gewählten Gruppe */
nav .unternav { border-top: 1px solid var(--border-light); padding-block: 9px 11px; }
nav .unternav[hidden] { display: none; }
nav .unternav a { font-size: 12px; }
nav .unternav a:not([aria-current]):not(:hover) { color: var(--text); }

main { padding-inline: 30px; }
section { padding-block: 24px 8px; scroll-margin-top: var(--kopf, 0px); }
.label { color: var(--cyan); font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; margin: 0 0 6px; }
section > .wrap > h2, .erklaerung h2 { font-size: 22px; font-weight: 400; }
section > .wrap > h2, .erklaerung { margin-bottom: 10px; }
.erklaerung > summary { cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; list-style: none; }
.erklaerung > summary::-webkit-details-marker { display: none; }
.erklaerung > summary > .klein::after { content: " ▸"; color: var(--cyan); }
.erklaerung[open] > summary > .klein::after { content: " ▾"; }
.erklaerung > summary:hover > .klein { color: var(--cyan-dark); }
.erklaerung .intro { margin: 8px 0 14px; }
.intro { max-width: 760px; margin: 0 0 20px; }
h3 { font-size: 16px; font-weight: 600; }
.klein { font-size: 13px; color: var(--text-light); }

.banner { background: var(--bg-gray); border-left: 3px solid var(--cyan); padding: 14px 20px; margin-top: 28px; font-size: 15px; }
.banner strong { color: var(--text-dark); }
.banner details { margin: 4px 0; }
.banner summary { cursor: pointer; }
.rechte { margin-top: 18px; }
.rechte > summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 6px 0; list-style: none; }
.rechte > summary::-webkit-details-marker { display: none; }
.rechte > summary::before { content: "▸"; color: var(--cyan); }
.rechte[open] > summary::before { content: "▾"; }
.rechte .tabelle { margin-top: 8px; }
.banner details div { margin-top: 4px; }
.regeln { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.regeln > span { min-width: 0; }
.legende { list-style: none; margin: 10px 0 0; padding: 0; font-size: 13.5px; }
.legende li { display: grid; grid-template-columns: 118px 1fr; gap: 10px; align-items: baseline; padding: 2px 0; }
.anteil { display: inline-block; width: 90px; height: 8px; background: var(--bg-gray); border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.anteil > span { display: block; height: 8px; background: var(--cyan); border-radius: 2px; }
td details.rechte > summary { padding: 0; }
tr.inhalt > td { background: var(--bg-gray); padding: 2px 18px 22px; }
tr.inhalt .label { margin: 16px 0 0; font-size: 12px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-top: 10px; }
.kpi { background: var(--bg-gray); border-radius: var(--radius); padding: 18px 18px 16px; }
.kpi .zahl { color: var(--cyan); font-size: 2rem; font-weight: 700; line-height: 1.1; }
.kpi .zahl small { font-size: 1rem; font-weight: 600; }
.kpi .was { font-size: 13px; color: var(--text); margin-top: 6px; }

.balken { margin-top: 30px; max-width: 760px; }
.balken h3 { margin-bottom: 4px; }
.balken .zeile { display: grid; grid-template-columns: minmax(120px, 230px) 1fr 84px; gap: 12px; align-items: center; padding: 5px 0; font-size: 14px; }
.balken .name { color: var(--text-dark); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.balken .spur { height: 10px; }
.balken .fuellung { height: 10px; background: var(--cyan); border-radius: 0 2px 2px 0; min-width: 2px; }
.balken .wert { text-align: right; color: var(--text-dark); font-variant-numeric: tabular-nums; }
.kontext-titel { margin: 28px 0 0; }
.unterreiter.schmal { max-width: 760px; }
.balken.im-reiter { margin-top: 14px; }
.balken.im-reiter h3 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); } /* die Überschrift steht schon auf dem Reiter */
.verlauf svg { display: block; width: 100%; height: auto; }
.verlauf .enden { display: flex; justify-content: space-between; color: var(--text-light); font-variant-numeric: tabular-nums; }

.tabelle { margin-top: 12px; }
/* Tabellenköpfe bleiben unter Seitenkopf und Filter stehen; nicht in aufgeklappten Zeilen. Der Rahmen einer
   zusammengelegten Tabelle wandert nicht mit, deshalb die Linie als Schatten. Kein overflow an .tabelle:
   Damit hinge der Kopf an diesem Kasten statt an der Seite; nur schmal scrollt die Tabelle für sich. */
.tabelle:not(tr .tabelle) > table > thead th { position: sticky; top: calc(var(--kopf, 0px) + var(--filter, 0px) - 4px); z-index: 4;
  background: var(--bg); box-shadow: inset 0 -1px 0 var(--cool-gray); }
@media (max-width: 900px) { .tabelle { overflow-x: auto; } }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-light); padding: 8px 10px; border-bottom: 1px solid var(--cool-gray); white-space: nowrap; vertical-align: bottom; }
th.sortierbar { cursor: pointer; user-select: none; }
th.sortierbar:hover { color: var(--cyan-dark); }
td { padding: 9px 10px; border-bottom: 1px solid var(--border-light); vertical-align: top; }
td.name { min-width: 150px; }
td.name strong { color: var(--text-dark); font-weight: 600; overflow-wrap: break-word; }
td.zahl, th.zahl { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
/* Knöpfe, die wie Text aussehen: Name zum Aufklappen, Spaltenkopf zum Sortieren. Damit gehen beide auch per Tastatur */
button.aufklappen, button.sortieren { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; text-align: left; cursor: pointer; }
button.aufklappen:focus-visible, button.sortieren:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
tr.haupt { cursor: pointer; }
tr.haupt:hover td { background: var(--bg-hover); }
tr.offen td { background: var(--bg-gray); border-bottom-color: transparent; }
tr.detail td { background: var(--bg-gray); padding: 4px 10px 18px; }
/* contain: der Inhalt der aufgeklappten Zeile zählt nicht zur Spaltenbreite, sonst verschieben sich beim Aufklappen die Spalten */
.detail dl { display: grid; grid-template-columns: 150px 1fr; gap: 6px 16px; margin: 0; font-size: 13.5px; contain: inline-size; }
.detail dt { color: var(--text-light); }
.detail dd { margin: 0; overflow-wrap: anywhere; }
.nowrap { white-space: nowrap; }

.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 2px; white-space: nowrap; line-height: 1.5; }
.e-entfernen { background: var(--text-dark); color: var(--bg); border: 1px solid var(--text-dark); }
.e-abschalten { background: var(--bg); color: var(--text-dark); border: 1px solid var(--text-dark); }
.e-manuell { background: var(--bg); color: var(--text-dark); border: 1px dashed var(--text-dark); }
.e-pruefen { background: var(--bg); color: var(--text-dark); border: 1px solid var(--cyan); }
.e-behalten { background: var(--cyan-10); color: var(--text-dark); border: 1px solid var(--cyan-20); }
.e-neu { background: var(--bg); color: var(--text-light); border: 1px dashed var(--cool-gray); }
.badge .geerbt { font-weight: 400; opacity: .8; }
.status { white-space: nowrap; font-size: 13.5px; }
.st-an span { color: var(--cyan); }
.st-aus { color: var(--text-light); }
.st-teil span { color: var(--cyan); }
.st-fehler { color: var(--text-dark); font-weight: 600; }
.tag { display: inline-block; font-size: 12px; border: 1px solid var(--cool-gray); color: var(--text-light); border-radius: 2px; padding: 0 6px; margin: 2px 4px 0 0; white-space: nowrap; }
.leer { color: var(--text-light); }

.befehl { display: flex; gap: 8px; align-items: flex-start; }
.befehl code { flex: 1; }
button.kopieren, button.zeilenknopf { font: 600 12px var(--body); color: var(--text-dark); background: var(--bg); border: 1px solid var(--cool-gray); border-radius: 2px; padding: 2px 8px; cursor: pointer; white-space: nowrap; }
button.kopieren:hover, button.zeilenknopf:hover { border-color: var(--cyan); color: var(--cyan-dark); }
.btn { font: 600 14px var(--body); text-transform: uppercase; letter-spacing: .05em; padding: 10px 22px; border-radius: var(--radius); border: 1px solid transparent; cursor: pointer; }
.btn-primary { background: var(--cyan); color: #fff; }
.btn-primary:hover { background: var(--cyan-dark); }
.btn-outline { background: var(--bg); color: var(--cyan); border-color: var(--cyan); }
.btn-outline:hover { background: var(--cyan); color: #fff; }
button:disabled { opacity: .45; cursor: default; pointer-events: none; }
.aktionsleiste { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.hero .aktionsleiste { margin-left: auto; align-items: flex-start; } /* Knöpfe auf einer Linie, die Zeitangaben hängen darunter */
.hero .btn { padding: 7px 14px; font-size: 12.5px; }
.hero .btn-outline { background: transparent; color: #fff; border-color: rgba(255,255,255,.45); }
.hero .btn-outline:hover { background: var(--cyan); border-color: var(--cyan); color: #fff; }
/* Sitzt im Kopf und wirkt auch ohne Server, deshalb fest im HTML statt in der Aktionsleiste */
.thema { align-self: flex-start; flex: none; background: transparent; border: 1px solid rgba(255,255,255,.45); border-radius: var(--radius); color: #fff; padding: 6px; line-height: 0; cursor: pointer; }
.thema:hover { background: var(--cyan); border-color: var(--cyan); }
.thema svg { display: block; width: 18px; height: 18px; }

.meldung { background: var(--bg-gray); border-left: 3px solid var(--cyan); padding: 14px 20px 16px; margin-top: 24px; max-width: 900px; font-size: 14.5px; }
.meldung .zeile { display: flex; gap: 12px; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
.meldung .label { margin: 0; }
.meldung p { margin: 0 0 8px; }
.meldung ul { margin: 0 0 8px; padding-left: 18px; }
.meldung li { margin: 3px 0; }
.meldung > :last-child { margin-bottom: 0; }
.meldung h4 { font-size: 15px; font-weight: 600; margin: 14px 0 6px; }
/* Lange Berichte füllten sonst die ganze Seite, bevor man die Tabs wieder sieht */
.meldung .inhalt.gekuerzt { max-height: 50vh; overflow: auto; }
.meldung .inhalt > :last-child { margin-bottom: 0; }
.suchfeld { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: flex-end; }
.suchfeld textarea { flex: 1 1 320px; max-width: 640px; font: 16px/1.5 var(--body); color: var(--text-dark); border: 1px solid var(--cool-gray); border-radius: var(--radius); padding: 9px 12px; background: var(--bg); resize: vertical; }
.suchfeld .btn:disabled { opacity: .5; cursor: default; }
/* Dialog: gebaut wie die Service-Card des Brand-Kits, dahinter der Hero-Overlay; ohne Schatten, das Kit kennt sie nur als Hover-Rückmeldung */
dialog.frage { border: 1px solid var(--border-light); border-top: 3px solid var(--cyan); border-radius: var(--radius); padding: 28px 24px; width: min(520px, calc(100vw - 40px)); background: var(--bg); color: var(--text); }
dialog.frage::backdrop { background: rgba(0,0,0,.52); }
dialog.frage h3 { font-size: 16px; font-weight: 600; margin-bottom: 10px; }
dialog.frage p { margin: 0 0 10px; }
dialog.frage ul { margin: 0 0 10px; padding-left: 18px; max-height: 40vh; overflow: auto; font-size: 14px; }
dialog.frage form { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-top: 22px; }
.kandidat { border-top: 1px solid var(--border-light); padding-top: 12px; margin-top: 12px; }
.kandidat .knoepfe { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
select.wahl { font: 13px var(--body); color: var(--text-dark); border: 1px solid var(--cool-gray); border-radius: var(--radius); padding: 3px 6px; background: var(--bg); }
select.wahl.gesetzt { border-color: var(--cyan); font-weight: 600; }
td details summary { white-space: nowrap; cursor: pointer; }
td details pre { margin: 6px 0 0; font: 12px/1.45 var(--mono); color: var(--text-dark); white-space: pre-wrap; overflow-wrap: anywhere; max-width: 420px; }

.empf-gruppe { margin-top: 30px; }
.empf-gruppe > .kopf { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.empf-gruppe > p { margin: 6px 0 0; font-size: 14px; max-width: 760px; }

.karten { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); gap: 18px; margin-top: 16px; }
.karte { background: var(--bg); border: 1px solid var(--border-light); border-top: 3px solid var(--cyan); border-radius: var(--radius); padding: 24px 22px; transition: box-shadow .15s; }
.karte:hover { box-shadow: var(--shadow-hover); }
.karte p { font-size: 14.5px; margin: 8px 0 0; }
.karte ul { list-style: none; padding: 0; margin: 14px 0 0; border-top: 1px solid var(--border-light); }
.karte li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border-light); font-size: 13.5px; }
.karte li .links { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; min-width: 0; }
.karte li strong { color: var(--text-dark); font-weight: 600; overflow-wrap: anywhere; }
.karte .fazit { background: var(--bg-gray); padding: 10px 12px; margin-top: 14px; font-size: 14px; border-radius: 2px; }
.karte .fazit b { color: var(--text-dark); }

.filter { display: flex; flex-wrap: wrap; gap: 10px 12px; align-items: center; margin-top: 8px; font-size: 14px;
  position: sticky; top: calc(var(--kopf, 0px) - 2px); z-index: 5; background: var(--bg); padding-block: 10px 8px; }
/* Bleibt beim Scrollen unter dem Seitenkopf stehen, 2px unter ihn geschoben: --kopf und --filter sind gerundete
   Höhen, und bei halben Pixeln schien die Tabelle darunter in einem Spalt durch. Der Tabellenkopf überlappt ebenso. */
.filter input[type=search], .filter select { font: 14px var(--body); color: var(--text-dark); border: 1px solid var(--cool-gray); border-radius: var(--radius); padding: 6px 9px; background: var(--bg); }
.filter input[type=search] { min-width: 220px; flex: 1 1 220px; max-width: 340px; }
.filter label { display: inline-flex; gap: 6px; align-items: center; }
.filter .anzahl { color: var(--text-light); margin-left: auto; }

.hinweis { margin-top: 16px; }
.hinweis .befehl { margin-top: 10px; }

/* Unterreiter im Stil der Navigation: Versalien, Unterstrich in Cyan */
.unterreiter { display: flex; flex-wrap: wrap; gap: 4px 22px; border-bottom: 1px solid var(--border-light); margin-top: 8px; }
.unterreiter button { position: relative; background: none; border: 0; padding: 10px 0; font: 600 13px var(--body); color: var(--text-dark); text-transform: uppercase; letter-spacing: .05em; cursor: pointer; }
.unterreiter button::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--cyan); transform: scaleX(0); transition: transform .15s; }
.unterreiter button:hover, .unterreiter button[aria-selected="true"] { color: var(--cyan); }
.unterreiter button:hover::after, .unterreiter button[aria-selected="true"]::after { transform: scaleX(1); }
.hilfe [role="tabpanel"] { padding-top: 12px; }
.hilfe ul { margin: 6px 0 0; padding-left: 18px; max-width: 760px; font-size: 14.5px; }
.hilfe li { margin: 5px 0; }

@media (max-width: 640px) {
  .hero { padding: 12px 20px; }
  .hero .btn { padding: 6px 10px; font-size: 11.5px; letter-spacing: .03em; }
  nav, main { padding-inline: 20px; }
  nav .wrap { flex-wrap: nowrap; overflow-x: auto; }
  nav a { white-space: nowrap; }
  .unterreiter { flex-wrap: nowrap; overflow-x: auto; }
  .unterreiter button { white-space: nowrap; }
  .balken .zeile { grid-template-columns: 110px 1fr 70px; }
  .detail dl { grid-template-columns: 1fr; }
  .detail dt { margin-top: 6px; }
}
</style>
<script>
/* Noch vor dem ersten Zeichnen: Eine gespeicherte Wahl gilt sofort, sonst bleibt die Systemeinstellung.
   Käme das erst am Seitenende, blitzte die falsche Darstellung kurz auf. */
try {
  const w = localStorage.getItem("3zero-harness-inventur:thema");
  if (w === "hell" || w === "dunkel") document.documentElement.dataset.thema = w;
} catch (_) { /* ohne Speicher gilt die Systemeinstellung */ }
</script>
</head>
<body>
<div class="seitenkopf">
<header class="hero"><div class="wrap">
  <img class="icon" src="__ICON__" width="52" height="52" alt="" aria-hidden="true">
  <div class="marke"><img class="logo" src="__LOGO__" alt="3zero" width="132" height="24"><div class="titelzeile"><h1>Harness-Inventur</h1><p id="stand"></p></div></div>
  <div class="rechts"><div class="aktionsleiste" id="aktionen"></div></div>
  <button type="button" class="thema" id="thema" aria-label="Darstellung wechseln"></button>
</div></header>
<nav aria-label="Abschnitte"><div class="wrap">

const wahlZelle = e => AKTIONEN ? `<td>${wahlFeld(e)}</td>` : "";

/* Filter über jeder Tabelle. „Skills“ filtert seine Daten selbst (skillsFiltern), die Empfehlungen entstehen bei jeder
   Aktion neu (empfFiltern). Alle anderen Tabellen stehen fertig im Dokument: tabellenFilter() setzt ein Suchfeld
   davor, das im Text der Zeile und ihrer aufgeklappten Einzelheiten sucht, und je Spalte mit data-filter eine
   Auswahl aus den Werten, die in der Tabelle vorkommen. Tabellen in aufgeklappten Zeilen bekommen keinen. */
const ohne = (el, weg) => { const k = el.cloneNode(true); k.querySelectorAll(weg).forEach(x => x.remove()); return k.textContent.replace(/\s+/g, " ").trim(); };
const zeilenText = zeile => ohne(zeile, "select, button.zeilenknopf, button.kopieren").toLowerCase();
/* eine Zelle kann mehrere Marken tragen („breit“ und „doppelt“): Jede ist ein eigener Wert */
const zellWerte = td => { const marken = [...td.querySelectorAll(".status, .badge")];
  return (marken.length ? marken : [td]).map(el => ohne(el, "[aria-hidden], select, .klein, .geerbt, button.zeilenknopf, button.kopieren")).filter(w => w && w !== "–"); };
function tabellenFilter() {
  document.querySelectorAll("#app .tabelle").forEach(huelle => {
    if (huelle.closest("tr, details, #empf-inhalt, #suche") || huelle.querySelector("#skills-body")) return;
    const tabelle = huelle.querySelector("table");
    const zeilen = [...tabelle.tBodies[0].rows].filter(r => !r.matches(".detail, .inhalt"));
    const einzelheiten = r => r.nextElementSibling?.matches(".detail, .inhalt") ? r.nextElementSibling : null;
    const text = new Map(zeilen.map(r => [r, zeilenText(r) + (einzelheiten(r) ? " " + zeilenText(einzelheiten(r)) : "")]));
    const spalten = [...tabelle.tHead.rows[0].cells].map((th, i) => [th, i]).filter(([th]) => th.dataset.filter);
    const leiste = document.createElement("div");
    leiste.className = "filter";
    leiste.innerHTML = '<input type="search" placeholder="Name oder Text suchen …" aria-label="In der Tabelle suchen">' + spalten.map(([th, i]) => {
      const werte = [...new Set(zeilen.flatMap(r => zellWerte(r.cells[i])))].sort((a, b) => a.localeCompare(b));
      return `<select data-spalte="${i}" aria-label="${esc(th.textContent)}"><option value="">${esc(th.dataset.filter)}</option>${werte.map(w => `<option>${esc(w)}</option>`).join("")}</select>`;
    }).join("") + '<span class="anzahl"></span>';
    /* Filter und Tabelle in einem Kasten: Der Filter bleibt nur stehen, solange seine Tabelle zu sehen ist.
       Sonst klebte er in einem Tab mit zwei Tabellen noch über der zweiten. */
    const block = document.createElement("div");
    huelle.before(block);
    block.append(leiste, huelle);
    const anwenden = () => {
      const q = leiste.querySelector("input").value.trim().toLowerCase();
      const wahl = [...leiste.querySelectorAll("select")].filter(s => s.value).map(s => [Number(s.dataset.spalte), s.value]);
      let sichtbar = 0;
      for (const r of zeilen) {
        const passt = text.get(r).includes(q) && wahl.every(([i, w]) => zellWerte(r.cells[i]).includes(w));
        if (!passt && einzelheiten(r) && !einzelheiten(r).hidden) klappe(r); /* sonst bliebe das Aufgeklappte ohne seine Zeile stehen */
        r.hidden = !passt;
        sichtbar += passt;
      }
      leiste.querySelector(".anzahl").textContent = `${sichtbar} von ${zeilen.length}`;
    };
    leiste.addEventListener("input", anwenden);
    anwenden();
  });
}
function empfFiltern() {
  const q = document.getElementById("empf-suche").value.trim().toLowerCase();
  const zeilen = [...document.querySelectorAll("#empf-inhalt tbody > tr")];
  zeilen.forEach(r => { r.hidden = !zeilenText(r).includes(q); });
  document.querySelectorAll("#empf-inhalt .empf-gruppe").forEach(g => { g.hidden = !g.querySelector("tbody > tr:not([hidden])"); });
  document.getElementById("empf-anzahl").textContent = zeilen.length ? `${zeilen.filter(r => !r.hidden).length} von ${zeilen.length}` : "";
}

/* Die Erläuterung steht eingeklappt hinter der Überschrift: Wer das Dashboard kennt, braucht sie nicht bei jedem
   Aufruf, und oben nahm sie den Platz der Tabelle. <div>, weil manche eine Legende als Liste enthalten. */
function abschnitt(id, titel, inhalt, intro) {
  const kopf = intro
    ? `<details class="erklaerung"><summary><h2>${esc(titel)}</h2><span class="klein">Erläuterung</span></summary><div class="intro">${intro}</div></details>`
    : `<h2>${esc(titel)}</h2>`;
  return `<section id="${id}"><div class="wrap">${kopf}${inhalt}</div></section>`;
}

/* Was seit dem letzten Lauf vor heute dazukam oder wegfiel, aus build.py (aenderungen). Ein Status zählt nicht,
   nur ob der Eintrag da ist. Neues verlinkt auf seinen Tab; Entferntes gibt es dort nicht mehr. */
const ARTEN = { mcp: ["MCP-Server", "mcp"], plugins: ["Plugins", "plugins"], skills: ["Skills", "skills"], hooks: ["Hooks", "hooks"],
  projekt_skills: ["Projekt-Skills", "projekte"], projekt_mcp: ["Projekt-MCP-Server", "projekte"] };
function renderAenderungen() {
  const a = D.aenderungen;
  if (!a || (!Object.keys(a.neu).length && !Object.keys(a.entfernt).length)) return "";
  const kurz = id => esc(id.slice(id.indexOf(":") + 1));
  /* eine Zeile je Art; nach einem ganz neuen Bestand wären das Dutzende Namen, die klappen ein */
  const zeilen = (wie, teil, link) => Object.entries(teil).filter(([art]) => ARTEN[art]).map(([art, ids]) => {
    const namen = ids.map(id => link ? `<a href="#${ARTEN[art][1]}">${kurz(id)}</a>` : kurz(id)).join(", ");
    const titel = `<strong>${wie}, ${ARTEN[art][0]}:</strong>`;
    return ids.length <= 8 ? `<div>${titel} ${namen}</div>` : `<details><summary>${titel} ${ids.length}</summary><div class="klein">${namen}</div></details>`;
  }).join("");
  return `<div class="banner"><strong>Seit dem Lauf vom ${datum(a.seit)}</strong>${zeilen("Neu", a.neu, true)}${zeilen("Entfernt", a.entfernt, false)}</div>`;
}

function renderUeberblick() {
  const mcpAn = D.mcp.filter(m => m.status === je("verbunden", "aktiv")).length;
  const plAn = D.plugins.filter(p => p.status === "aktiv").length;
  const skAn = D.skills.filter(s => s.status === "aktiv").length;
  const zaehle = t => ALLE.filter(e => e.bewertung?.empfehlung === t && !umgesetzt(e)).length;
  const ungenutzt = D.skills.filter(s => s.ungenutzt);
  const banner = [];
  /* Nach einem frischen Bestand sind das schnell über hundert IDs; ausgeschrieben füllen sie den halben Bildschirm */
  const idListe = ids => ids.length <= 6 ? ` ${ids.map(esc).join(", ")}.`
    : `<details><summary class="klein">alle ${ids.length} anzeigen</summary><div class="klein">${ids.map(esc).join(", ")}</div></details>`;
  if (D.unbewertet.length) banner.push(`<strong>${D.unbewertet.length} Einträge sind neu und noch nicht bewertet:</strong>${idListe(D.unbewertet)}`);
  if (D.entfallen.length) banner.push(`<strong>${D.entfallen.length} bewertete Einträge sind nicht mehr installiert:</strong>${idListe(D.entfallen)}`);
  if (D.live_status === false) banner.push("<strong>MCP-Status nur aus der Konfiguration:</strong> <code>claude mcp list</code> war beim Erstellen nicht erreichbar.");
  if (D.lesefehler?.length) banner.push(`<strong>${D.lesefehler.length === 1 ? "Eine Quelle ließ" : `${D.lesefehler.length} Quellen ließen`} sich nicht einlesen und fehlen unten:</strong> ${D.lesefehler.map(f => `${esc(f.quelle)} (<code>${esc(f.fehler)}</code>)`).join(", ")}. Alles andere ist vollständig.`);
  if (D.config_lesbar === false) banner.push("<strong><code>~/.codex/config.toml</code> ließ sich nicht lesen:</strong> MCP-Server, aktivierte Plugins, abgeschaltete Skills und Projekte fehlen deshalb unten. Erst die Datei richtigstellen, dann neu einlesen — sonst bewertet der Skill einen halben Bestand.");
  const bannerHtml = banner.length ? `<div class="banner">${banner.join("<br>")}<br>Führe in ${esc(D.harness_name)} <code>${je("/", "$")}3zero-harness-inventur</code> aus, um die Bewertung nachzuziehen.</div>` : "";

  const kpis = `<div class="kpis">
    <div class="kpi"><div class="zahl">${mcpAn}<small> / ${D.mcp.length}</small></div><div class="was">MCP-Server ${je("verbunden", "aktiv")} / eingetragen</div></div>
    <div class="kpi"><div class="zahl">${plAn}<small> / ${D.plugins.length}</small></div><div class="was">Plugins aktiv / installiert</div></div>
    <div class="kpi"><div class="zahl">${skAn}<small> / ${D.skills.length}</small></div><div class="was">Skills, Befehle, Agenten aktiv / gesamt</div></div>
    <div class="kpi"><div class="zahl">≈ ${zahl(tokensGesamt)}</div><div class="was">Tokens je Sitzung für automatisch geladene Beschreibungen, SessionStart-Hooks, MCP-Anweisungen und Werkzeugnamen, ohne die eingebauten Skills</div></div>
    <div class="kpi"><div class="zahl">${zaehle("entfernen")}</div><div class="was">Empfehlungen zum Entfernen, dazu ${zaehle("abschalten") + zaehle("nur manuell")} zum Abschalten, ${zaehle("prüfen")} zum Prüfen</div></div>
    <div class="kpi"><div class="zahl">− ${zahl(tokensSparen)}</div><div class="was">Tokens je Sitzung nach Umsetzung (ohne „prüfen“)</div></div>
    <div class="kpi"><div class="zahl">${ungenutzt.length}<small> · ≈ ${zahl(ungenutzt.reduce((s, e) => s + e.tokens, 0))}</small></div><div class="was">Skills laden in jede Sitzung und wurden seit ${D.ungenutzt_tage} Tagen nicht genutzt (Tokens je Sitzung); im Tab Skills über den Statusfilter „${esc(UNGENUTZT)}“</div></div>
  </div>`;

  const summen = new Map();
  JE_SITZUNG.filter(e => e.tokens > 0).forEach(e => {
    const k = e.id?.startsWith("mcp:") ? "MCP-Server" : e.plugin ? `Plugin ${e.plugin.split("@")[0]}` : (e.quelle?.autor || "unbekannt");
    const v = summen.get(k) || { tokens: 0, anzahl: 0 };
    v.tokens += e.tokens; v.anzahl += 1; summen.set(k, v);
  });
  const reihen = [...summen.entries()].sort((a, b) => b[1].tokens - a[1].tokens);
  const max = reihen.length ? reihen[0][1].tokens : 1;
  /* Die Zeitreihe braucht zwei Tage; solange es die nicht gibt, steht der Balken allein und behält seine Überschrift */
  const zeit = verlauf();
  const balken = `<div class="balken${zeit ? " im-reiter" : ""}" id="kontext-herkunft"${zeit ? ' role="tabpanel" aria-labelledby="kontext-reiter-herkunft"' : ""}><h3>Kontextlast nach Herkunft</h3>
    <p class="klein" style="margin:0 0 10px">Beschreibungen, die ${esc(D.harness_name)} in jede Sitzung lädt, Text, den SessionStart-Hooks einspielen, die Anweisungen der MCP-Server und die Namen ihrer Werkzeuge (grob geschätzt: Zeichen ÷ 4). Die Schemata der Werkzeuge fehlen, weil sie erst bei Bedarf laden. Skills mit „${NUR_MANUELL}“ kosten nichts. Die eingebauten Skills des Harness fehlen hier: ${je("Claude Code legt sie nicht auf der Platte ab", "Codex zeigt sie im Tab „Skills“, gezählt werden sie nicht")}.</p>
    ${reihen.map(([k, v]) => `<div class="zeile" title="${esc(k)}: ${v.anzahl} Einträge, ≈ ${zahl(v.tokens)} Tokens">
      <span class="name">${esc(k)}</span>
      <span class="spur"><span class="fuellung" style="display:block;width:${(v.tokens / max * 100).toFixed(1)}%"></span></span>
      <span class="wert">≈ ${zahl(v.tokens)}</span></div>`).join("")}
  </div>`;
  const kontext = zeit
    ? `<h2 class="kontext-titel">Kontextlast</h2>
       <div class="unterreiter schmal" role="tablist">
         <button type="button" role="tab" id="kontext-reiter-herkunft" aria-controls="kontext-herkunft" aria-selected="true">nach Herkunft</button>
         <button type="button" role="tab" id="kontext-reiter-zeit" aria-controls="kontext-zeit" aria-selected="false" tabindex="-1">über die Zeit</button>
       </div>${balken}${zeit}`
    : balken;
  return abschnitt("ueberblick", "Was installiert ist und was es kostet", renderAenderungen() + bannerHtml + kpis + kontext);
}

/* Empfehlungen: was der Eintrag tut, warum die Empfehlung so lautet, und die Umsetzung in derselben Zeile */
const GRUPPEN_TEXT = {
  "entfernen": "Deinstallieren. Alles lässt sich bei Bedarf wieder installieren.",
  "abschalten": je("Einzelne Skills aus einem Plugin, das bleibt. Abschalten per skillOverrides in ~/.claude/settings.json.",
    "Einzelne Skills, die bleiben, aber nicht laden sollen. Abschalten per [[skills.config]] in ~/.codex/config.toml."),
  "nur manuell": je("Bleiben per /name erreichbar, laden ihre Beschreibung aber nicht mehr in jede Sitzung.",
    "Bleiben per $name erreichbar, laden ihre Beschreibung aber nicht mehr in jede Sitzung (agents/openai.yaml)."),
  "prüfen": "Hier fehlt deine Entscheidung. Der Befehl zeigt, wie das Entfernen ginge.",
  "selbst gewählt": "Ohne offene Empfehlung, von dir in den Bestandstabellen gewählt.",
};
function renderEmpfehlungen() {
  return abschnitt("empfehlungen", "Was weg kann und was du entscheiden solltest",
    '<div class="filter"><input type="search" id="empf-suche" placeholder="Name oder Text suchen …" aria-label="In den Empfehlungen suchen"><span class="anzahl" id="empf-anzahl"></span></div><div id="empf-inhalt"></div>',
    "Die Empfehlungen stützen sich auf Nutzungszahlen, Überschneidungen und den Inhalt der Skills." +
    (AKTIONEN ? ` Wähle in der Spalte „Aktion“, was geschehen soll, und starte es je Zeile oder alles zusammen. Wirksam ab der nächsten ${je("Claude-Code", esc(D.harness_name))}-Sitzung.`
      : " Nichts wird automatisch geändert."));
}
function empfZeile(e) {
  const a = gewaehlt(e);
  const befehl = a ? `<div class="klein" style="margin-top:5px"><code>${esc(befehlText(e, a))}</code>${warnung(e, a) ? `<div>${esc(warnung(e, a))}</div>` : ""}</div>` : befehlZeile(e.befehl);
  return `<tr><td class="name" style="min-width:170px"><strong>${esc(e.name)}</strong><div class="klein">${typText(e)} · ${quelleText(e)}</div></td>
    <td style="min-width:220px">${was(e)}</td>
    <td style="min-width:220px">${txt(e.bewertung?.grund || "")}</td>
    <td style="min-width:250px">${AKTIONEN ? wahlFeld(e) + befehl : befehlZeile(e.befehl)}</td>
    ${AKTIONEN ? `<td>${ausfuehrZelle(e)}</td>` : ""}</tr>`;
}
function renderEmpfInhalt() {
  let html = "";
  const typen = ["entfernen", "abschalten", "nur manuell", "prüfen"];
  const offen = e => typen.includes(e.bewertung?.empfehlung) && !umgesetzt(e);
  const gruppen = typen.map(typ => [typ, ALLE.filter(e => e.bewertung?.empfehlung === typ && offen(e))]);
  /* alles mit Aktion, das in keiner der Empfehlungsgruppen steht */
  gruppen.push(["selbst gewählt", ALLE.filter(e => gewaehlt(e) && !offen(e))]);
  for (const [typ, roh] of gruppen) {
    const liste = roh.sort((a, b) => a.name.localeCompare(b.name));
    if (!liste.length) continue;
    const shell = liste.map(e => e.befehl).filter(b => !b.includes("→"));
    const alle = shell.length > 1 && (typ === "entfernen" || typ === "prüfen")
      ? `<button type="button" class="kopieren" data-copy="${esc(shell.join("\n"))}">alle ${shell.length} Befehle kopieren</button>` : "";
    html += `<div class="empf-gruppe"><div class="kopf"><h3>${typ === "selbst gewählt" ? '<span class="badge e-neu">selbst gewählt</span>' : empfBadge({ bewertung: { empfehlung: typ } })} ${liste.length} Einträge</h3>${alle}</div>
      <p>${GRUPPEN_TEXT[typ]}</p>
      <div class="tabelle"><table><thead><tr><th>Name</th><th>Was es macht</th><th>Warum</th><th>${AKTIONEN ? "Aktion" : "Befehl"}</th>${AKTIONEN ? "<th>Ausführen</th>" : ""}</tr></thead>
      <tbody>${liste.map(empfZeile).join("")}</tbody></table></div></div>`;
  }
  const erledigt = ALLE.filter(umgesetzt).map(e => e.name).sort((a, b) => a.localeCompare(b));
  if (erledigt.length) html += `<p class="klein">Schon umgesetzt: ${erledigt.map(esc).join(", ")}.</p>`;
  document.getElementById("empf-inhalt").innerHTML = html || '<p class="leer">Keine offenen Empfehlungen.</p>';
  empfFiltern();
  if (TOKEN) {
    const offen = warteschlange().filter(e => !ERGEBNIS.get(e.id)?.ok).length;
    document.querySelectorAll(".zahl-aktionen").forEach(z => { z.textContent = offen ? ` (${offen})` : ""; });
  }
}

function renderGruppen() {
  const karten = D.gruppen.map(g => {
    const zeilen = g.mitglieder.map(id => {
      const e = INDEX.get(id);
      if (!e) return `<li><span class="links"><strong>${esc(id)}</strong><span class="klein">nicht mehr vorhanden</span></span></li>`;
      return `<li><span class="links"><strong>${esc(e.name)}</strong><span class="klein">${typText(e)} · ${quelleText(e)}</span></span>
        <span class="links"><span class="klein">${nutzungText(e)}</span>${statusBadge(e.status)}${empfBadge(e)}</span></li>`;
    }).join("");
    return `<article class="karte"><h3>${esc(g.titel)}</h3><p>${txt(g.einschaetzung)}</p><ul>${zeilen}</ul>
      <div class="fazit"><b>Empfehlung:</b> ${txt(g.empfehlung)}</div></article>`;
  }).join("");
  return abschnitt("ueberschneidungen", `${D.gruppen.length} Bereiche mit mehreren Werkzeugen für dieselbe Aufgabe`,
    `<div class="karten">${karten}</div>`);
}

/* Ein Punkt je Tag, an dem build.py lief: zeigt, ob das Aufräumen die Kontextlast senkt.
   Mit weniger als zwei Tagen gibt es nichts zu zeigen. */
function verlauf() {
  const reihe = D.verlauf || [];
  if (reihe.length < 2) return "";
  const werte = reihe.map(e => e.kontextlast);
  const hoch = Math.max(...werte), tief = Math.min(...werte), spanne = hoch - tief;
  /* Bei lauter gleichen Werten gäbe es keine Spanne: die Linie läge sonst am unteren Rand statt in der Mitte */
  const y = v => spanne ? 108 - (v - tief) / spanne * 96 : 60;
  const punkt = (e, i) => [(20 + i / (reihe.length - 1) * 720).toFixed(1), y(e.kontextlast).toFixed(1)];
  const punkte = reihe.map(punkt);
  const erste = reihe[0], letzte = reihe[reihe.length - 1];
  const diff = letzte.kontextlast - erste.kontextlast;
  const trend = diff === 0 ? "gleich geblieben" : diff < 0 ? `${zahl(-diff)} Tokens weniger` : `${zahl(diff)} Tokens mehr`;
  return `<div class="balken verlauf im-reiter" id="kontext-zeit" role="tabpanel" aria-labelledby="kontext-reiter-zeit" hidden><h3>Kontextlast über die Zeit</h3>
    <p class="klein" style="margin:0 0 10px">Ein Punkt je Tag, an dem die Inventur lief. Seit ${datum(erste.datum)} ${trend}.</p>
    <svg viewBox="0 0 760 128" role="img" aria-label="Kontextlast je Inventurlauf, ${zahl(erste.kontextlast)} bis ${zahl(letzte.kontextlast)} Tokens">
      <polyline points="${punkte.map(p => p.join(",")).join(" ")}" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
      ${punkte.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--cyan)"><title>${datum(reihe[i].datum)}: ≈ ${zahl(reihe[i].kontextlast)} Tokens</title></circle>`).join("")}
    </svg>
    <div class="klein enden"><span>${datum(erste.datum)} · ≈ ${zahl(erste.kontextlast)}</span><span>${datum(letzte.datum)} · ≈ ${zahl(letzte.kontextlast)}</span></div>
  </div>`;
}

/* Der Name ist ein Knopf: So klappt die Detailzeile auch per Tastatur auf, ein Klick auf die übrige Zeile genügt weiterhin */
const aufklapp = name => `<button type="button" class="aufklappen" aria-expanded="false"><strong>${esc(name)}</strong></button>`;
/* Wie detailZeile, aber mit freiem Inhalt (Tabellen); eigene Klasse, weil `tr.detail td` auch die Zellen darin träfe */
const inhaltZeile = (spalten, html) => `<tr class="inhalt" hidden><td colspan="${spalten}">${html}</td></tr>`;
function detailZeile(spalten, paare) {
  const dl = paare.filter(([, v]) => v).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("");
  return `<tr class="detail" hidden><td colspan="${spalten}"><dl>${dl}</dl></td></tr>`;
}

/* null heißt „nicht gemessen“ und ist etwas anderes als eine gemessene Null: Codex protokolliert
   weder Werkzeugliste noch Anweisungsblock, in Claude Code fehlt beides für nie geladene Server. */
const ungemessen = '<span class="leer">nicht gemessen</span>';

function renderMcp() {
  const ausIn = n => n ? ` <span class="klein">· aus in ${n} ${n === 1 ? "Projekt" : "Projekten"}</span>` : "";
  const werkzeuge = m => typeof m.werkzeuge === "number" ? zahl(m.werkzeuge) : ungemessen;
  const kontext = m => typeof m.tokens === "number" ? (m.tokens ? "≈ " + zahl(m.tokens) : '<span class="leer">–</span>') : ungemessen;
  /* Server im Netz: Die Domain kommt aus der Konfiguration, vom Server stammen nur Zahlen */
  const imNetz = m => m.netz ? `<div class="klein" title="Server im Netz">↗ ${esc(m.netz.domain)} · Anmeldung: ${esc(m.netz.anmeldung)}</div>` : "";
  const netzDetails = m => m.netz ? [
    `Domain <code>${esc(m.netz.domain)}</code> · Anmeldung: ${esc(m.netz.anmeldung)}`,
    typeof m.anweisungen === "number" ? (m.anweisungen ? `Anweisungen: ≈ ${zahl(m.anweisungen)} Tokens fremder Text in jeder Sitzung, der das Modell lenken kann` : "keine Anweisungen") : "",
    typeof m.lesend === "number" && m.werkzeuge ? (m.lesend === m.werkzeuge ? `alle ${zahl(m.werkzeuge)} Werkzeuge nur lesend (laut Server)`
      : `${zahl(m.werkzeuge - m.lesend)} von ${zahl(m.werkzeuge)} Werkzeugen nicht als nur lesend ausgezeichnet (laut Server)`) : "",
  ].filter(Boolean).join("<br>") : "";
  const zeilen = D.mcp.map(m => `<tr class="haupt"><td class="name">${aufklapp(m.name)}${imNetz(m)}</td>
      <td>${esc(m.art)}</td><td>${statusBadge(m.status)}${ausIn(m.aus_in_projekten.length)}</td>
      <td class="zahl">${werkzeuge(m)}</td><td class="zahl">${kontext(m)}</td><td class="zahl">${nutzungText(m)}</td>

    je(`Global eingetragene Server; was nur in einem Projekt gilt, steht unter Projekte. Status laut <code>claude mcp list</code>, abgefragt aus einem Ordner ohne Projekt-Abschaltungen. ` +
      `„Genutzt“ stammt aus den Transkripten der letzten ${D.hook_tage} Tage. HTTP-Server ohne Anmeldung fragt die Inventur einmal am Tag selbst nach Anweisungen und Werkzeugen; alle anderen misst sie in denselben Transkripten, und wer dort nie geladen wurde, steht als „nicht gemessen“. ` +
      `„Kontext je Sitzung“ zählt den Anweisungsblock und die Werkzeugnamen. Die Schemata laden erst bei Bedarf; bei direkt gefragten Servern stehen sie in den Details. ` +
      `↗ markiert Server im Netz, mit der Domain aus der Konfiguration und der Art der Anmeldung; ihr Anweisungsblock ist fremder Text in jeder Sitzung. „nur lesend“ ist eine Angabe des Servers, keine Prüfung. ` +
      `„deaktivieren“ sperrt einen Server per <code>deniedMcpServers</code> in <code>~/.claude/settings.json</code> für alle Projekte. Zeile anklicken für Details.`,
      "Global eingetragene Server aus <code>~/.codex/config.toml</code> und den Plugins; was nur in einem Projekt gilt, steht unter Projekte. Status aus der Konfiguration (<code>enabled</code>), ohne Verbindungstest. " +
      "„Genutzt“ zählt MCP-Aufrufe in den Codex-Sitzungen. Werkzeuge und Kontextkosten protokolliert Codex nicht; HTTP-Server ohne Anmeldung fragt die Inventur deshalb einmal am Tag selbst. „Kontext je Sitzung“ zählt dann Anweisungsblock und Werkzeugnamen, die Schemata stehen in den Details. ↗ markiert Server im Netz, mit Domain und Anmeldung. Zeile anklicken für Details."));
}

        ["Marktplatz", p.marktplatz_repo ? link(`https://github.com/${p.marktplatz_repo}`, p.marktplatz_repo) : esc(p.marktplatz)],

  return abschnitt("plugins", "Installierte Plugins, ihre Nutzung und Kontextkosten",

    je("„Genutzt“ zählt Aufrufe der Skills und Befehle eines Plugins. „Kontext“ ist die geschätzte Tokenzahl, die seine Beschreibungen und SessionStart-Hooks in jeder Sitzung belegen.",
      "Plugins aus <code>~/.codex/plugins/cache</code> mit ihrem Schalter in <code>~/.codex/config.toml</code>. „im Konto“: kommt aus deinem ChatGPT-Konto, geschaltet wird dort. „wirkungslos“: steht in config.toml, aber Codex lädt openai-curated-Plugins aus dem Online-Katalog. „Genutzt“ zählt Codex-Sitzungen, in denen Skills des Plugins liefen. „Kontext“ ist die geschätzte Tokenzahl seiner Skill-Beschreibungen je Sitzung."));

/* Skills-Tabelle mit Filter und Sortierung */
const F = { suche: "", quelle: "", status: "", aufruf: "", empf: "", geteilt: "", teile: true, sort: "name", richtung: 1 };
/* Filter und Sortierung überleben das Neuladen, das nach jeder Aktion und nach „neu einlesen“ kommt; je Harness wie die Auswahl */
const FILTER_SPEICHER = `3zero-harness-inventur:filter:${D.harness}`;
const FILTERFELDER = [["f-suche", "suche"], ["f-quelle", "quelle"], ["f-status", "status"], ["f-aufruf", "aufruf"], ["f-empf", "empf"], ["f-geteilt", "geteilt"]];
try {
  const gemerkt = JSON.parse(localStorage.getItem(FILTER_SPEICHER)) || {};
  for (const k in F) if (typeof gemerkt[k] === typeof F[k]) F[k] = gemerkt[k];
} catch (_) { /* ohne Speicher gelten die Vorgaben */ }
/* Skills aus ~/.agents/skills liegen für beide Harnesses im selben Ordner und laden deshalb in beiden */
const GETEILT = je("auch in Codex", "auch in Claude Code");
const UNGENUTZT = `seit ${D.ungenutzt_tage} Tagen ungenutzt`;
function renderSkillsRahmen() {
  const quellen = [...new Set(SKILLS.map(lieferweg))].sort((a, b) => a.localeCompare(b));
  const opt = (werte, leer) => `<option value="">${leer}</option>` + werte.map(w => `<option>${esc(w)}</option>`).join("");
  const filter = `<div class="filter">
    <input type="search" id="f-suche" placeholder="Name oder Text suchen …" aria-label="In Name und Beschreibung suchen">
    <select id="f-quelle" aria-label="Herkunft">${opt(quellen, "alle Herkünfte")}</select>
    <select id="f-status" aria-label="Status">${opt(["aktiv", "aus", "Update verfügbar", UNGENUTZT], "jeder Status")}</select>
    <select id="f-aufruf" aria-label="Aufruf">${opt(je(["automatisch + /", "nur /", "nur automatisch", "als Subagent"], ["automatisch + $", "nur $"]), "jeder Aufruf")}</select>
    <select id="f-empf" aria-label="Empfehlung">${opt(["entfernen", "abschalten", "nur manuell", "prüfen", "behalten", "keine", "unbewertet"], "jede Empfehlung")}</select>
    <select id="f-geteilt" aria-label="Gilt in beiden Harnesses">${opt([`nur für ${D.harness_name}`, GETEILT], "beide Harnesses")}</select>
    <label><input type="checkbox" id="f-teile" checked> Plugin-Bestandteile</label>
    <span class="anzahl" id="f-anzahl"></span></div>`;
  const kopf = [["name", "Name"], [null, "Herkunft"], [null, "Aufruf"], ["tokens", "Kontext", "zahl"], ["nutzung", "Genutzt", "zahl"], [null, "Was es macht"], [null, "Empfehlung"]]
    .map(([k, t, c]) => k ? `<th class="sortierbar ${c || ""}" data-sort="${k}"><button type="button" class="sortieren">${t} <span class="richtung" aria-hidden="true">↕</span></button></th>`
      : `<th class="${c || ""}">${t}</th>`).join("") + WAHL_KOPF;
  return abschnitt("skills", "Skills, Befehle und Agenten",
    filter + `<div class="tabelle"><table><thead><tr>${kopf}</tr></thead><tbody id="skills-body"></tbody></table></div>`,
    je(`Globale Skills aus ~/.claude/skills (davon viele per <code>npx skills</code> aus ~/.agents/skills verlinkt), eigene Befehle, alles, was Plugins mitbringen, und die in Claude Code eingebauten Skills. „nur /“ heißt: lädt erst, wenn du den Befehl eintippst. Eingebaute lassen sich nicht deinstallieren; ihre Liste pflegt <code>/3zero-harness-inventur</code>, Stand ${datum(D.bewertung_stand)}. Skills aus ~/.agents/skills liegen für beide Harnesses im selben Ordner und tragen deshalb die Markierung „${esc(GETEILT)}“; der Filter rechts zeigt sie oder nur die übrigen.`,
      `Skills aus ~/.agents/skills (dort legt <code>npx skills</code> sie ab) und ~/.codex/skills, alles, was Plugins mitbringen, und die in Codex eingebauten Skills aus ~/.codex/skills/.system. „nur $“ heißt: lädt erst, wenn du <code>$name</code> eintippst (<code>agents/openai.yaml</code>). „Genutzt“ zählt Codex-Sitzungen. Eingebaute lassen sich nicht deinstallieren. Skills aus ~/.agents/skills liegen für beide Harnesses im selben Ordner und tragen deshalb die Markierung „${esc(GETEILT)}“; der Filter rechts zeigt sie oder nur die übrigen.`));
}
function skillsFiltern() {
  try { localStorage.setItem(FILTER_SPEICHER, JSON.stringify(F)); } catch (_) { /* dann gilt er nur für diese Seite */ }
  const q = F.suche.toLowerCase();
  const liste = SKILLS.filter(s => {
    const empf = s.bewertung ? (wirksam(s)?.empfehlung || "keine") : "unbewertet";
    return (F.teile || !s.plugin)
      && (!q || `${s.name} ${s.beschreibung || ""} ${s.bewertung?.was || ""}`.toLowerCase().includes(q))
      && (!F.quelle || lieferweg(s) === F.quelle)
      && (!F.status || (F.status === "Update verfügbar" ? s.update : F.status === UNGENUTZT ? s.ungenutzt : s.status === F.status))
      && (!F.aufruf || s.aufruf === F.aufruf)
      && (!F.empf || empf === F.empf)
      && (!F.geteilt || (F.geteilt === GETEILT ? !!s.geteilt : !s.geteilt));
  });
  const zahlwert = s => F.sort === "tokens" ? s.tokens : F.sort === "nutzung" ? (s.nutzung?.anzahl || 0) : null;
  /* Namen über localeCompare wie in den übrigen Tabellen: mit > und < landen Umlaute hinter „z“ */
  liste.sort((a, b) => (zahlwert(a) === null
    ? a.name.localeCompare(b.name)
    : (zahlwert(a) > zahlwert(b) ? 1 : zahlwert(a) < zahlwert(b) ? -1 : 0)) * F.richtung);
  document.querySelectorAll("#skills th[data-sort]").forEach(th => {
    const aktiv = th.dataset.sort === F.sort;
    if (aktiv) th.setAttribute("aria-sort", F.richtung === 1 ? "ascending" : "descending");
    else th.removeAttribute("aria-sort");
    th.querySelector(".richtung").textContent = aktiv ? (F.richtung === 1 ? "↑" : "↓") : "↕";
  });
  document.getElementById("f-anzahl").textContent = `${liste.length} von ${SKILLS.length}`;
  document.getElementById("skills-body").innerHTML = liste.map(s => {
    const kontext = s.tokens ? `≈ ${zahl(s.tokens)}` : '<span class="leer">–</span>';
    return `<tr class="haupt"><td class="name">${aufklapp(s.name)}<div class="klein">${esc(s.typ)}${s.status === "aus" ? " · aus" : ""}</div>
        ${s.reife ? `<span class="tag">${esc(s.reife)}</span>` : ""}${s.update ? '<span class="tag">Update verfügbar</span>' : ""}${s.ungenutzt ? `<span class="tag" title="${esc(UNGENUTZT)}, lädt aber in jede Sitzung">ungenutzt</span>` : ""}${s.geteilt ? `<span class="tag">${esc(GETEILT)}</span>` : ""}</td>
      <td>${esc(lieferweg(s))}</td><td class="nowrap klein">${s.aufruf ? esc(s.aufruf) : '<span class="leer">–</span>'}</td><td class="zahl">${kontext}</td>
      <td class="zahl">${nutzungText(s)}</td><td>${was(s)}</td><td>${empfBadge(s)}</td>${wahlZelle(s)}</tr>` +
      detailZeile(7 + SP, [
        ["Beschreibung", esc(s.beschreibung)],
        ["Begründung", txt(s.bewertung?.grund || "")],
        ["Autor", esc(autor(s))],
        ["Quelle", s.quelle.url ? link(s.quelle.url, s.quelle.repo || s.quelle.url) : esc(s.quelle.repo || s.quelle.art)],
        ["Upstream-Status", s.reife ? esc(s.reife) + " (laut Ordner im Quell-Repo)" : ""],
        ["Installiert", s.installiert ? datum(s.installiert) : ""],
        ["skillOverrides", s.override ? `<code>${esc(s.override)}</code>` : ""],
        ["Datei", s.pfad ? `<code>${esc(s.pfad)}</code>` : ""],
        ["Umsetzen", s.befehl ? befehlZeile(s.befehl) : ""],
      ]);
  }).join("");
}

/* Alles, was nur in einem Projekt gilt, je Projekt: zusätzliche Skills, Befehle und MCP-Server, dazu dort abgeschaltete globale Server */
function renderProjekte() {
  const projekte = new Map();
  const zu = pfad => projekte.get(pfad) || projekte.set(pfad, { skills: [], mcp: [], aus: [], regeln: [], gemessen: [] }).get(pfad);
  D.projekt_skills.forEach(s => zu(s.projekt).skills.push(s));
  D.projekt_mcp.forEach(m => zu(m.projekt).mcp.push(m));
  D.mcp.filter(m => !m.gesperrt).forEach(m => m.aus_in_projekten.forEach(p => zu(p).aus.push(m.name)));
  /* Regeln und Tokens stehen auch in ihren eigenen Tabs, dort über alle Projekte; hier je Projekt beisammen.
     Unter Codex gelten Regeln nur global, und gemessene Ordner sind oft keine Projekte: Dort kommt nichts Neues dazu. */
  (D.berechtigungen || []).filter(z => z.bereich !== "global" && z.art !== "Vertrauen").forEach(z => zu(z.bereich).regeln.push(z));
  ((D.modelle || {}).gemessen || []).forEach(z => {
    const ziel = [...projekte.keys()].find(k => kurzPfad(k) === z.projekt) || (!CODEX && /^[~\/]/.test(z.projekt) ? z.projekt : null);
    if (ziel) zu(ziel).gemessen.push(z);
  });

  const skillZeile = s => `<tr class="haupt"><td class="name">${aufklapp(s.name)}</td><td>${esc(s.typ)}</td>
      <td>${esc(lieferweg(s))}</td><td class="nowrap klein">${esc(s.aufruf)}</td>
      <td class="zahl">${s.tokens ? "≈ " + zahl(s.tokens) : '<span class="leer">–</span>'}</td><td class="zahl">${nutzungText(s)}</td>
      <td>${was(s)}</td><td>${empfBadge(s)}</td>${wahlZelle(s)}</tr>` +
    detailZeile(8 + SP, [
      ["Beschreibung", esc(s.beschreibung)],
      ["Begründung", txt(s.bewertung?.grund || "")],
      ["Autor", esc(autor(s))],
      ["Quelle", s.quelle.url ? link(s.quelle.url, s.quelle.repo) : esc(s.quelle.art)],
      ["Datei", `<code>${esc(s.pfad)}</code>`],
      ["Umsetzen", befehlZeile(s.befehl)],
    ]);
  const mcpZeile = m => `<tr class="haupt"><td class="name">${aufklapp(m.name)}</td><td>MCP-Server</td>
      <td>${m.art === "lokal" ? "lokal in ~/.claude.json" : esc(m.art)}</td><td>${statusBadge(m.status)}</td>
      <td class="zahl"><span class="leer">–</span></td><td class="zahl">${nutzungText(m)}</td>
      <td>${was(m)}</td><td>${empfBadge(m)}</td>${wahlZelle(m)}</tr>` +
    detailZeile(8 + SP, [
      ["Ziel", m.ziel ? `<code>${esc(m.ziel)}</code>` : ""],
      ["Quelle", `<code>${esc(m.quelle)}</code>`],
      ["Begründung", txt(m.bewertung?.grund || "")],
      ["Entfernen", befehlZeile(m.befehl)],
    ]);

  const anzahl = (n, eins, viele) => n && `${n} ${n === 1 ? eins : viele}`;
  const kurz = pfad => pfad.replace(/^\/Users\/[^/]+/, "~");
  const strich = '<span class="leer">–</span>';
  const teil = (titel, html) => html ? `<p class="label">${titel}</p>${html}` : "";
  const spalten = je(7, 5);
  /* ~ oder ein Ordner voller Projekte ist selbst keins (build.sammelordner). Lädt dort aber etwas, bleibt er stehen:
     Projekt-Skills und Projekt-Server zeigt nur dieser Tab. */
  const sammel = new Set((D.sammelordner || []).map(kurzPfad));
  const weggelassen = [...projekte.entries()].filter(([pfad, p]) => sammel.has(kurzPfad(pfad)) && !p.skills.length && !p.mcp.length && !p.aus.length).map(([pfad]) => pfad);
  weggelassen.forEach(pfad => projekte.delete(pfad));
  const zeilen = [...projekte.entries()].sort(([a], [b]) => a.split("/").pop().localeCompare(b.split("/").pop())).map(([pfad, p]) => {
    const tokens = p.skills.reduce((s, e) => s + e.tokens, 0);
    const extra = [];
    if (p.skills.length) extra.push(anzahl(p.skills.length, "Skill oder Befehl", "Skills und Befehle") + (tokens ? ` (≈ ${zahl(tokens)} Tokens je Sitzung)` : ""));
    if (p.mcp.length) extra.push(`${p.mcp.length} MCP-Server`);
    const ohneOrdner = p.mcp.some(m => m.status === "Ordner fehlt");
    const zeile = [extra.length && `${ohneOrdner ? "Eingetragen, aber nie geladen" : "Lädt zusätzlich"}: ${extra.join(", ")}.`,
      p.aus.length && `Abgeschaltet: ${p.aus.map(esc).join(", ")}.`].filter(Boolean).join(" ");
    const fehlt = ohneOrdner ? ' <span class="tag">Ordner fehlt</span>' : "";
    const eintraege = [...p.skills].sort((a, b) => a.name.localeCompare(b.name)).map(skillZeile).join("") + p.mcp.map(mcpZeile).join("");
    const name = pfad.split("/").pop() || pfad;
    return `<tr class="haupt"><td class="name">${aufklapp(name)}${fehlt}${kurz(pfad) === name ? "" : `<div class="klein">${esc(kurz(pfad))}</div>`}</td>
      <td class="zahl">${p.skills.length || strich}</td><td class="zahl">${p.mcp.length || strich}</td>
      ${je(`<td class="zahl">${p.regeln.length || strich}</td><td>${esc(RECHT.zusammen(p.regeln)) || strich}</td>`, "")}
      <td class="zahl">${p.gemessen.length ? zahl(MESSUNG.summe(p.gemessen)) : strich}</td><td class="klein">${MESSUNG.jeModell(p.gemessen).map(m => esc(m.modell)).join(", ") || strich}</td></tr>` +
      inhaltZeile(spalten, (zeile ? `<p class="klein" style="margin:12px 0 0">${zeile}</p>` : "") +
        teil("Skills und MCP-Server", eintraege && `<div class="tabelle"><table><thead><tr><th>Name</th><th>Art</th><th>Herkunft</th><th>Status</th><th class="zahl">Kontext</th><th class="zahl">Genutzt</th><th>Was es macht</th><th>Empfehlung</th>${WAHL_KOPF}</tr></thead><tbody>${eintraege}</tbody></table></div>`) +
        teil("Regeln ohne Rückfrage", p.regeln.length && RECHT.gebuendelt(p.regeln)) +
        teil(`Modelle, letzte ${esc((D.modelle || {}).tage)} Tage`, p.gemessen.length && MESSUNG.messung(p.gemessen)));
  }).join("");
  const gruppen = zeilen && `<div class="tabelle"><table><thead><tr><th>Projekt</th><th class="zahl">Skills</th><th class="zahl">MCP-Server</th>${je('<th class="zahl">Regeln</th><th>auffällig</th>', "")}<th class="zahl">Ausgabe-Tokens</th><th>Modelle</th></tr></thead><tbody>${zeilen}</tbody></table></div>` +
    (weggelassen.length ? `<p class="klein">Nicht gezeigt, weil darin andere Projekte liegen: ${weggelassen.map(p => `<code>${esc(kurz(p))}</code>`).join(", ")}. Ihre Regeln stehen unter „Berechtigungen“, ihre Tokens unter „Modelle“.</p>` : "");
  return abschnitt("projekte", "Was in den einzelnen Projekten gilt",
    gruppen || '<p class="leer">Keine projektbezogenen Skills, Befehle oder MCP-Server gefunden.</p>',
    je("Alles zu einem Projekt an einer Stelle: seine Regeln, die Modelle, die dort liefen, und was dort laut ~/.claude.json zusätzlich lädt (<code>.claude/skills</code>, <code>.claude/commands</code>, <code>.mcp.json</code>, lokal eingetragene MCP-Server) und welche globalen Server dort abgeschaltet sind. Projekt-Skills zählen nicht zur Kontextlast je Sitzung. Der MCP-Status stammt aus der Konfiguration, ohne Verbindungstest. „Genutzt“ zählt nach Namen und kann Aufrufe gleichnamiger Skills anderswo enthalten.",
      "Alles zu einem Projekt an einer Stelle: die Modelle, die dort liefen, und was dort laut ~/.codex/config.toml zusätzlich lädt (<code>.agents/skills</code>, <code>.codex/skills</code>, MCP-Server aus <code>.codex/config.toml</code>). Skills laden in jedem Projekt, MCP-Server nur in vertrauten (<code>trust_level = \"trusted\"</code>). Projekt-Skills zählen nicht zur Kontextlast je Sitzung. Der MCP-Status stammt aus der Konfiguration, ohne Verbindungstest."));
}

function renderHooks() {
  const herkunft = h => h.plugin ? `Plugin ${h.plugin.split("@")[0]}` : h.quelle.autor;
  const ausgabe = h => h.ausgabe ? `≈ ${zahl(h.ausgabe.tokens)} <span class="klein">· ${zahl(h.ausgabe.laeufe)}× · ${datum(h.ausgabe.zuletzt)}</span>` : '<span class="leer">keine erfasst</span>';
  const dauer = h => h.dauer ? `${zahl(h.dauer.median)} ms <span class="klein">· ${zahl(h.dauer.messungen)}×</span>` : ungemessen;
  const befehle = h => h.befehle.map(b => `<div><code>${esc(b.befehl)}</code>${b.matcher ? ` <span class="klein">bei ${esc(b.matcher)}</span>` : ""}${b.bedingung ? ` <span class="klein">wenn ${esc(b.bedingung)}</span>` : ""}</div>`).join("");
  const zeilen = D.hooks.map(h => `<tr class="haupt"><td class="name">${aufklapp(h.name)}</td>
      <td>${esc(herkunft(h))}</td><td>${statusBadge(h.status)}</td><td class="nowrap">${h.mod ? "Mod" : "Befehl"} <span class="klein">· ${h.befehle.length}</span></td>
      <td class="zahl">${h.tokens ? "≈ " + zahl(h.tokens) : '<span class="leer">–</span>'}</td><td class="zahl">${ausgabe(h)}</td><td class="zahl">${dauer(h)}</td>
      <td>${was(h)}</td><td>${empfBadge(h)}</td>${wahlZelle(h)}</tr>` +
    detailZeile(9 + SP, [
      [h.mod ? "Greift ein in" : "Befehle", befehle(h)],
      ["Ausgabe an " + je("Claude", "Codex"), h.ausgabe ? `zuletzt ≈ ${zahl(h.ausgabe.tokens)} Tokens am ${datum(h.ausgabe.zuletzt)}, höchstens ≈ ${zahl(h.ausgabe.max)}, ${zahl(h.ausgabe.laeufe)} Läufe mit Ausgabe in ${D.hook_tage} Tagen` : ""],
      ["Laufzeit", h.dauer ? `im Mittel ${zahl(h.dauer.median)} ms, höchstens ${zahl(h.dauer.max)} ms, aus ${zahl(h.dauer.messungen)} Messungen in ${D.hook_tage} Tagen` : ""],
      ["Begründung", txt(h.bewertung?.grund || "")],
      ["Datei", `<code>${esc(h.pfad)}</code>`],
      ["Entfernen", befehlZeile(h.befehl)],
    ])).join("");
  return abschnitt("hooks", "Was bei Ereignissen automatisch läuft",
    `<div class="tabelle"><table><thead><tr><th data-filter="jedes Ereignis">Ereignis</th><th data-filter="jede Herkunft">Herkunft</th><th data-filter="jeder Status">Status</th><th data-filter="jede Art">Art</th><th class="zahl">Kontext je Sitzung</th><th class="zahl">Ausgabe an ${je("Claude", "Codex")}</th><th class="zahl">Dauer</th><th>Was er macht</th><th data-filter="jede Empfehlung">Empfehlung</th>${WAHL_KOPF}</tr></thead><tbody>${zeilen}</tbody></table></div>`,
    je(`Befehle, die Claude Code bei Ereignissen ausführt, aus ~/.claude/settings.json und den Plugins, dazu die Statuszeile. „Ausgabe an Claude“ ist, was ein Hook laut den Transkripten der letzten ${D.hook_tage} Tage zuletzt an Claude zurückgab, mit der Zahl der Läufe, die überhaupt etwas zurückgaben. Blockiert ein Hook das Turn-Ende, speichert Claude Code dessen Text ohne den Befehl; solche Läufe fehlen hier. „Dauer“ ist der Median der gemessenen Laufzeiten aus denselben Transkripten, mit der Zahl der Messungen: Hooks laufen, während du wartest. „Kontext je Sitzung“ zählt nur SessionStart-Hooks; ihr Anteil steckt auch in der Kontextlast im Überblick. Abschalten lassen sich Hooks nur mit ihrem Plugin oder in settings.json. Die Art „Mod“ ist kein Befehl, sondern Code, der in der Sitzung mitläuft (ein Modul unter <code>modules</code> in <code>hooks/hooks.json</code>): Er kann Werkzeug-Aufrufe sperren oder umschreiben und Prompt und System-Prompt ändern. Das Ereignis ist am Text des Moduls abgelesen, nicht gemessen; was in importierten Dateien steht, fehlt. Hooks und Mods kommen auch aus Ordnern, die ohne Installation laden: Skill-Ordner mit eigener <code>plugin.json</code>, <code>CLAUDE_CODE_PLUGIN_DIRS</code> und <code>~/.claude/dev-mods</code> (nur in der Sitzung, in der sie entstanden).`,
      "Befehle und MCP-Aufrufe, die Codex bei Ereignissen ausführt, aus ~/.codex/config.toml, ~/.codex/hooks.json und den Plugins, dazu <code>notify</code>. Was Hooks an Codex zurückgeben und wie lange sie laufen, protokolliert Codex nicht. Abschalten lassen sich Hooks nur mit ihrem Plugin oder in der Konfiguration."));
}

/* Laufzeiten und Kommandozeilen, die Inventur, MCP-Server und Hooks brauchen. Nur Anzeige und Befehl zum Kopieren:
   Ein Update aus dem Browser könnte laufende MCP-Server und Hooks stören, und die feste Version von skills soll erst geprüft werden. */
function renderWerkzeuge() {
  const liste = D.werkzeuge || [];
  const zeilen = liste.map(w => `<tr><td class="name"><strong>${esc(w.name)}</strong><div class="klein"><code>${esc(w.id)}</code></div></td>
      <td class="nowrap">${w.installiert ? esc(w.installiert) : '<span class="leer">–</span>'}</td>
      <td class="nowrap">${w.neueste ? esc(w.neueste) : '<span class="leer">unbekannt</span>'}${w.neue_linie ? `<div class="klein">neue Linie: ${esc(w.neue_linie)}</div>` : ""}</td>
      <td class="nowrap">${w.pflege_bis ? datum(w.pflege_bis) : '<span class="leer">–</span>'}</td>
      <td>${statusBadge(w.status)}</td><td class="klein">${w.gebraucht_von.map(esc).join("<br>")}</td>
      <td style="min-width:250px">${w.befehl ? befehlZeile(w.befehl) : w.status === "veraltet" || w.status === "ohne Pflege" ? '<span class="klein">von Hand; die Installationsart ist nicht erkennbar</span>' : ""}${w.id === "python3" && w.befehl
        ? '<div class="klein">Danach den Server neu starten: Er läuft sonst mit dem gelöschten alten Python weiter, und Aktionen scheitern.</div>' : ""}</td></tr>`).join("");
  return abschnitt("versionen", "Programme und ihre Versionen",
    `<div class="tabelle"><table><thead><tr><th>Programm</th><th>installiert</th><th>neueste</th><th>Pflege bis</th><th data-filter="jeder Status">Status</th><th>gebraucht von</th><th>Aktualisieren</th></tr></thead><tbody>${zeilen}</tbody></table></div>` + renderQuellcode(),
    `Was die Inventur selbst braucht und was deine MCP-Server und Hooks laut ihrem Befehl starten. „veraltet“ heißt: In der eigenen Versionslinie gibt es Neueres; eine neuere Linie steht darunter, macht aber nichts veraltet. „ohne Pflege“: Die Linie bekommt keine Sicherheitsupdates mehr. Die neuesten Versionen kommen von endoflife.date, npm und GitHub, einmal am Tag abgefragt; ohne Netz gilt der letzte Stand. Aktualisieren musst du selbst — den Befehl gibt es, wo die Installationsart am Pfad erkennbar ist (Homebrew, npm, Bun, Claude Code). <code>skills</code> läuft in fester Version: Eine neuere erst prüfen, dann in <code>harness.py</code> eintragen.`);
}

/* MCP-Server, die als Quellcode unter ~ liegen. Ruht ein Projekt upstream, veralten seine Abhängigkeiten trotzdem:
   Die Sicherheitsmeldungen gelten der installierten Version, ob sie den Server treffen, hängt davon ab, wie er das Paket nutzt. */
function renderQuellcode() {
  const liste = D.quellcode || [];
  if (!liste.length) return "";
  const upstream = q => {
    const u = q.upstream;
    const teile = [statusBadge(u.status)];
    if (u.letzter_commit) teile.push(`<div class="klein">letzter Commit upstream: ${datum(u.letzter_commit)}</div>`);
    if (q.ruht) teile.push(`<div class="klein"><strong>ruht</strong> seit über ${D.ruhend_tage} Tagen: niemand hebt die Abhängigkeiten für dich an</div>`);
    if (u.lokale_aenderungen) teile.push('<div class="klein">lokale Änderungen: vor einem pull sichern</div>');
    if (u.repo) teile.push(`<div class="klein">${link("https://github.com/" + u.repo, u.repo)}</div>`);
    else if (u.remote) teile.push(`<div class="klein"><code>${esc(u.remote)}</code></div>`);
    return teile.join("");
  };
  const paket = p => `<div><code>${esc(p.name)}</code> ${esc(p.installiert)}${p.neueste && p.neueste !== p.installiert ? ` → ${esc(p.neueste)}` : ""}
    ${p.meldungen.map(m => `<div class="klein">${statusBadge("Sicherheitsmeldung")} ${esc(m.schwere || "")}: ${link(m.url, m.titel || m.id)}${m.behoben ? `, behoben in ${esc(m.behoben)}` : ""}</div>`).join("")}</div>`;
  const zeilen = liste.map(q => `<tr><td class="name"><strong>${esc(q.name)}</strong><div class="klein">${q.server.map(esc).join(", ")}</div><div class="klein"><code>${esc(q.id)}</code></div></td>
      <td>${upstream(q)}</td><td>${q.pakete.length ? q.pakete.map(paket).join("") : '<span class="leer">keine npm-Abhängigkeiten</span>'}</td>
      <td style="min-width:250px">${[q.upstream.befehl, q.befehl].filter(Boolean).map(befehlZeile).join("")}</td></tr>`).join("");
  return `<h3 style="margin-top:28px">MCP-Server aus Quellcode</h3>
    <p class="intro">MCP-Server, die als Quellcode unter ~ liegen, meist als Git-Klon. „Upstream“ vergleicht mit dem Repo, aus dem sie stammen; ein ruhendes Projekt bekommt keine Updates mehr. Die Abhängigkeiten veralten trotzdem: Gezeigt sind die direkten npm-Pakete mit Sicherheitsmeldungen zur installierten Version (GitHub Advisory Database). Ob eine Meldung deinen Server trifft, hängt davon ab, wie er das Paket nutzt; das Update ist meist trotzdem der einfachere Weg.</p>
    <div class="tabelle"><table><thead><tr><th>Ordner</th><th>Upstream</th><th>Abhängigkeiten</th><th>Aktualisieren</th></tr></thead><tbody>${zeilen}</tbody></table></div>`;
}

/* Regeln eines Bereichs, nach Werkzeug gebündelt: im Tab „Berechtigungen“ und je Projekt im Tab „Projekte“ */
const RECHT = (() => {
  const strich = '<span class="leer">–</span>';
  const marken = z => z.marken.map(statusBadge).join(" ");
  const zusammen = zeilen => ["breit", "verwaist", "widerspricht", "doppelt"].map(m => [m, zeilen.filter(z => z.marken.includes(m)).length])
    .filter(([, n]) => n).map(([m, n]) => `${n} ${m}`).join(", ");
  const datei = z => z.bereich === "global" || z.art === "Vertrauen" ? z.quelle : z.quelle.replace(/^.*\/(\.claude\/[^/]+)$/, "$1");
  const regelArt = z => ["allow", "ask", "deny", "prompt", "forbidden"].includes(z.art);
  // Bash(git push *) steht in der Zeile „Bash“ nur noch als „git push *“; unter Codex ist das Werkzeug das Programm, auch mit Pfad davor
  const werkzeug = z => !regelArt(z) ? RECHT_ART[z.art] || z.art : z.regel.startsWith("mcp__") ? "MCP" : z.regel.split(/[\s(]/)[0].split("/").pop() || z.regel.split(/\s/)[0];
  const kurz = z => { const m = regelArt(z) && z.regel.match(/^[\w-]+\((.*)\)$/s); return m ? m[1] : z.regel; };
  const gebuendelt = zeilen => {
    const gruppen = new Map();
    for (const z of zeilen) {
      const k = [werkzeug(z), z.art, z.quelle, !!z.verwaltet].join("\n");
      if (!gruppen.has(k)) gruppen.set(k, []);
      gruppen.get(k).push(z);
    }
    return `<div class="tabelle"><table><thead><tr><th>Werkzeug</th><th>Art</th><th>Quelle</th><th>Regeln</th></tr></thead><tbody>${
      [...gruppen.values()].sort((x, y) => y.length - x.length).map(g => `<tr><td class="nowrap"><strong>${esc(werkzeug(g[0]))}</strong> <span class="klein">${g.length}</span></td>
        <td class="nowrap">${regelArt(g[0]) ? esc(RECHT_ART[g[0].art]) : strich}${g[0].verwaltet ? '<div class="klein">verwaltet</div>' : ""}</td><td class="klein">${esc(datei(g[0]))}</td>
        <td><div class="regeln">${[...g].sort((x, y) => y.marken.length - x.marken.length).map(z => `<span><code>${esc(kurz(z))}</code>${z.marken.length ? " " + marken(z) : ""}</span>`).join("")}</div></td></tr>`).join("")}</tbody></table></div>`;
  };
  const werkzeuge = zeilen => { const n = new Map(); zeilen.forEach(z => n.set(werkzeug(z), (n.get(werkzeug(z)) || 0) + 1)); return [...n].sort((a, b) => b[1] - a[1]).map(([w]) => w); };
  return { marken, zusammen, datei, gebuendelt, werkzeuge };
})();

/* Was der Harness ohne Rückfrage darf. Der erste Reiter zeigt nur, was markiert ist, mit dem Knopf zum Entfernen
   (nur über den Server); der zweite je Projekt eine Zeile, aufgeklappt nach Werkzeug gebündelt.
   Ein Projekt sammelt schnell Dutzende Regeln, die sich nur im Befehl unterscheiden. */
const RECHT_ART = { allow: "erlaubt", ask: "fragt", prompt: "fragt", deny: "verboten", forbidden: "verboten",
  Modus: "Modus", Ordner: "Ordner", Vertrauen: "vertraut", unlesbar: "unlesbar" };
const kurzPfad = pfad => pfad.replace(/^\/(Users|home)\/[^/]+(?=\/|$)/, "~");
/* Unter-Reiter in einem Tab; das Umschalten erledigt waehleReiter() für alle role="tab" */
function reiter(id, teile) {
  const knoepfe = teile.map(([titel], i) => `<button type="button" role="tab" id="${id}-reiter-${i}" aria-controls="${id}-teil-${i}" aria-selected="${i === 0}"${i ? ' tabindex="-1"' : ""}>${titel}</button>`).join("");
  return `<div class="unterreiter" role="tablist">${knoepfe}</div>` +
    teile.map(([, html], i) => `<div role="tabpanel" id="${id}-teil-${i}" aria-labelledby="${id}-reiter-${i}"${i ? " hidden" : ""}>${html}</div>`).join("");
}
const ordnerName = pfad => pfad === "global" ? je("Global (alle Projekte)", "Global") : pfad.replace(/\/+$/, "").split("/").pop() || pfad;
function renderBerechtigungen() {
  const liste = D.berechtigungen || [];
  const strich = '<span class="leer">–</span>';
  const { marken, zusammen, datei, gebuendelt, werkzeuge } = RECHT;
  const auffaellig = liste.filter(z => z.marken.length);
  const knopf = z => z.aktionen?.entfernen ? `<button type="button" class="zeilenknopf" data-recht="${esc(z.id)}">entfernen</button>` : '<span class="leer">von Hand</span>';
  const oben = auffaellig.length
    ? `<div class="tabelle"><table><thead><tr><th>Regel</th><th data-filter="${je("jedes Projekt", "jeder Bereich")}">${je("Projekt", "Bereich")}</th><th>Quelle</th><th data-filter="jeder Hinweis">Hinweis</th>${TOKEN ? "<th>Aufräumen</th>" : ""}</tr></thead><tbody>${
      auffaellig.map(z => `<tr><td><code>${esc(z.art === "Vertrauen" ? kurzPfad(z.bereich) : z.regel)}</code></td><td class="nowrap">${esc(z.art === "Vertrauen" ? "Vertraute Ordner" : ordnerName(z.bereich))}</td>
        <td class="klein">${esc(datei(z))}</td><td class="nowrap">${marken(z)}</td>${TOKEN ? `<td class="nowrap">${knopf(z)}</td>` : ""}</tr>`).join("")}</tbody></table></div>`
    : '<p class="leer">Nichts Auffälliges: keine breite, verwaiste, widersprüchliche oder doppelte Regel.</p>';
  const gruppe = (titel, pfad, zeilen, inhalt) => `<details class="rechte"><summary><strong>${esc(titel)}</strong>
    <span class="klein">${pfad ? esc(pfad) + " · " : ""}${zeilen.length} ${zeilen.length === 1 ? "Eintrag" : "Einträge"}${zusammen(zeilen) ? " · " + zusammen(zeilen) : ""}</span></summary>${inhalt}</details>`;
  const vertrauen = liste.filter(z => z.art === "Vertrauen");
  const regeln = liste.filter(z => z.art !== "Vertrauen");
  const bereiche = [...new Set(regeln.map(z => z.bereich))];
  const vertrauensTabelle = vertrauen.length ? gruppe("Vertraute Ordner", "", vertrauen, `<div class="tabelle"><table><thead><tr><th>Ordner</th><th>Vertrauen</th><th>Hinweis</th></tr></thead><tbody>${
    vertrauen.map(z => `<tr><td><code>${esc(kurzPfad(z.bereich))}</code></td><td>${esc(z.regel)}</td><td>${marken(z) || strich}</td></tr>`).join("")}</tbody></table></div>`) : "";
  // je Projekt eine Zeile, die auffälligsten zuerst; ein Klick zeigt die gebündelten Regeln
  const MARKEN = ["breit", "verwaist", "widerspricht", "doppelt"].filter(m => regeln.some(z => z.marken.includes(m)));
  const auffaellige = b => regeln.filter(z => z.bereich === b && z.marken.length).length;
  const jeBereich = `<div class="tabelle"><table><thead><tr><th>${je("Projekt", "Bereich")}</th><th class="zahl">Regeln</th>${MARKEN.map(m => `<th class="zahl">${m}</th>`).join("")}<th>Werkzeuge</th></tr></thead><tbody>${
    [...bereiche].sort((x, y) => (y === "global") - (x === "global") || auffaellige(y) - auffaellige(x) || ordnerName(x).localeCompare(ordnerName(y))).map(b => {
      const z = regeln.filter(r => r.bereich === b), anzahl = m => z.filter(r => r.marken.includes(m)).length;
      return `<tr class="haupt"><td class="name">${aufklapp(ordnerName(b))}${b === "global" ? "" : `<div class="klein">${esc(kurzPfad(b))}</div>`}</td><td class="zahl">${z.length}</td>
        ${MARKEN.map(m => `<td class="zahl">${anzahl(m) || strich}</td>`).join("")}<td class="klein">${werkzeuge(z).map(esc).join(", ")}</td></tr>` + inhaltZeile(3 + MARKEN.length, gebuendelt(z));
    }).join("")}</tbody></table></div>`;
  const inhalt = liste.length
    ? reiter("rechte", [[`Auffällig${auffaellig.length ? ` (${auffaellig.length})` : ""}`, oben],
      [`Alle Regeln je ${je("Projekt", "Bereich")}`, (regeln.length ? jeBereich : "") + vertrauensTabelle]])
    : '<p class="leer">Keine Regeln gefunden: Es gelten die Standards des Harness.</p>';
  const legende = eintraege => `<ul class="legende">${eintraege.map(([m, text]) => `<li>${statusBadge(m)} <span>${text}</span></li>`).join("")}</ul>`;
  return abschnitt("berechtigungen", "Was ohne Rückfrage erlaubt ist", inhalt,
    je(`Aus den verwalteten Einstellungen, <code>~/.claude/settings.json</code> und je Projekt aus <code>.claude/settings.json</code> und <code>.claude/settings.local.json</code>. ${TOKEN ? "Markierte Regeln nimmt „entfernen“ aus ihrer Datei, mit Sicherung daneben; alles andere änderst du von Hand in der genannten Datei." : "Ändern von Hand in der genannten Datei."}` +
      legende([["breit", `ein ganzes Werkzeug (etwa <code>Bash</code> ohne Klammer), ein ganzer MCP-Server, ein Interpreter mit beliebigen Argumenten wie <code>Bash(python3:*)</code>, <code>defaultMode: bypassPermissions</code>, Ordner wie <code>~</code>`],
        ["verwaist", "eine Regel für einen MCP-Server, der nicht mehr eingetragen ist"], ["widerspricht", "dieselbe Regel steht auch als ask oder deny; es gilt die strengere"],
        ["doppelt", "die Regel steht im Projekt und gilt schon global"]]),
      `Aus <code>~/.codex/config.toml</code> (<code>approval_policy</code>, <code>sandbox_mode</code>, auch in Profilen, und die vertrauten Ordner) und den Regeln in <code>~/.codex/rules</code>. ${TOKEN ? "Einen verwaisten Ordner nimmt „entfernen“ aus <code>config.toml</code>, mit Sicherung daneben; alles andere änderst du von Hand in der genannten Datei." : "Ändern von Hand in der genannten Datei."}` +
      legende([["breit", `<code>approval_policy: never</code>, <code>sandbox_mode: danger-full-access</code> oder eine Regel für ein ganzes Programm oder eine Shell mit <code>-c</code>`],
        ["verwaist", "ein vertrauter Ordner, den es nicht mehr gibt"]])));
}

/* Tokens je Modell als Tabelle: im Tab „Modelle“ und je Projekt im Tab „Projekte“ */
const MESSUNG = (() => {
  const strich = '<span class="leer">–</span>';
  const summe = (zeilen, feld = "tokens") => zeilen.reduce((n, z) => n + (z[feld] || 0), 0);
  const prozent = (teil, ganz) => ganz ? Math.round(100 * teil / ganz) : 0;
  const anteil = (teil, ganz) => `<span class="anteil"><span style="width:${prozent(teil, ganz)}%"></span></span> ${prozent(teil, ganz)} %`;
  const aufwand = zeilen => esc([...new Set(zeilen.flatMap(z => z.aufwand))].sort().join(", ")) || strich;
  const sub = zeilen => summe(zeilen.filter(z => z.subagent));
  const tokenKoepfe = '<th class="zahl">Eingabe</th><th class="zahl">Cache geschrieben</th><th class="zahl">Cache gelesen</th><th class="zahl">Ausgabe</th>';
  const tokenZellen = zeilen => ["eingabe", "cache_schreiben", "cache_lesen", "tokens"].map(f => `<td class="zahl">${zahl(summe(zeilen, f))}</td>`).join("");
  // je Modell eine Zeile
  const jeModell = zeilen => [...new Set(zeilen.map(z => z.modell))].map(m => ({ modell: m, zeilen: zeilen.filter(x => x.modell === m) }))
    .sort((a, b) => summe(b.zeilen) - summe(a.zeilen));
  const messung = zeilen => { const ganz = summe(zeilen);
    return `<div class="tabelle"><table><thead><tr><th>Modell</th>${tokenKoepfe}<th>Anteil Ausgabe</th>${je('<th class="zahl">aus Subagenten</th>', "")}<th class="zahl">${je("Antworten", "Turns")}</th><th>Aufwand</th></tr></thead><tbody>${

  return { summe, prozent, anteil, sub, tokenKoepfe, tokenZellen, jeModell, messung };

  const eingestellt = M.eingestellt.length

        <td>${esc(z.eintrag || (z.bereich === "global" ? "alles" : "Projekt"))}${z.bereich !== "global" ? `<div class="klein">${esc(z.bereich)}</div>` : ""}${z.verwaltet ? '<div class="klein">verwaltet</div>' : ""}</td>

  const projekte = [...new Set(M.gemessen.map(z => z.projekt))].map(p => [p, M.gemessen.filter(z => z.projekt === p)]).sort((a, b) => summe(b[1]) - summe(a[1]));

      <td class="klein">${jeModell(zeilen).map(m => esc(m.modell)).join(", ")}</td></tr>` + inhaltZeile(je(8, 7), messung(zeilen))).join("")}</tbody></table></div>`;
  const leer = `<p class="leer">Keine ${je("Antworten", "Turns")} in den letzten ${esc(M.tage)} Tagen.</p>`;
  return abschnitt("modelle", "Welches Modell eingestellt ist und welches lief",
