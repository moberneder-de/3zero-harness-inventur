      [`Je ${je("Projekt", "Ordner")}`, M.gemessen.length ? jeProjekt : leer]]),
    je(`Eingestellt ist, was in den Einstellungen und im Kopf von Agenten, Skills und Befehlen steht. Gemessen ist, welches Modell laut Transkripten wirklich lief, in Tokens: ` +
      `Eingabe ist neu gelesener Text, Ausgabe das Geschriebene. Was sich wiederholt, liegt im Cache: einmal geschrieben, danach nur gelesen. ` +
      `Ein Subagent bekommt sein Modell oft erst beim Aufruf: Das steht in keiner Datei, nur in der Messung. Seine Arbeitsordner zählen zum Projekt. Nur Anzeige: Ändern von Hand in der genannten Datei oder mit <code>/model</code>.` +

/* Claudes Zusammenfassung kommt als Markdown: Absätze, Listen, **fett**, `code` */
function markdown(text) {
  const inline = s => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const teile = [];
  let absatz = [], punkte = [], reihen = [];
  const absatzZu = () => { if (absatz.length) teile.push(`<p>${inline(absatz.join(" "))}</p>`); absatz = []; };
  const listeZu = () => { if (punkte.length) teile.push(`<ul>${punkte.map(p => `<li>${inline(p)}</li>`).join("")}</ul>`); punkte = []; };
  const zellen = z => z.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
  const tabelleZu = () => {
    if (reihen.length) {
      const [kopf, ...rest] = reihen;
      teile.push(`<div class="tabelle"><table><thead><tr>${kopf.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead>` +
        `<tbody>${rest.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
    }
    reihen = [];
  };
  for (const zeile of esc(text).split("\n")) {
    /* Tabellen: ohne sie würde eine Markdown-Tabelle als ein langer Absatz erscheinen */
    const reihe = zeile.trim().startsWith("|") ? zellen(zeile) : null;
    if (reihe && reihe.every(c => /^:?-{2,}:?$/.test(c))) continue; /* Trennzeile unter dem Kopf */
    if (reihe) { absatzZu(); listeZu(); reihen.push(reihe); continue; }
    tabelleZu();
    const punkt = zeile.match(/^\s*[-*]\s+(.*)$/);
    const titel = zeile.match(/^#{1,4}\s+(.*)$/);
    if (titel) { absatzZu(); listeZu(); teile.push(`<h4>${inline(titel[1])}</h4>`); }
    else if (punkt) { absatzZu(); punkte.push(punkt[1]); }
    else if (!zeile.trim()) { absatzZu(); listeZu(); }
    else { listeZu(); absatz.push(zeile.trim()); }
  }
  absatzZu(); listeZu(); tabelleZu();
  return teile.join("");
}
function renderMeldung() {

async function api(pfad, daten) {
  try {
    /* X-Harness: Startet der Skill im anderen Harness, während die Seite offen ist, lehnt der Server ab, statt dessen Konfiguration zu ändern */
    const r = await fetch(pfad, { method: "POST", headers: { "X-Token": TOKEN, "X-Harness": D.harness, "Content-Type": "application/json" }, body: daten && JSON.stringify(daten) });
    /* 409 heißt nur: Der Server steht inzwischen auf dem anderen Harness. Kein Fehler des Laufs, die Seite ist veraltet */
    return r.status === 409 ? { ...await r.json(), harnessWechsel: true } : await r.json();
  } catch (_) {
    return { ok: false, verbindung: false, ausgabe: "Keine Antwort vom Server. Läuft python3 server.py noch?" };
  }
}
async function mitSperre(arbeit) {
  beschaeftigt = true; zeichne();
  try { await arbeit(); } finally { beschaeftigt = false; zeichne(); }
}
/* Die Aktion kommt vom Aufrufer, festgehalten beim Klick bzw. bei der Bestätigung: Liest man sie erst hier,
   liefe nach einer Umstellung während der Warteschlange eine Aktion, die niemand bestätigt hat */
async function fuehreAus(e, aktion) {
  ERGEBNIS.set(e.id, { laeuft: true }); zeichne();
  ERGEBNIS.set(e.id, await api("/api/ausfuehren", { id: e.id, aktion }));
}

async function neuEinlesen() {
  setMeldung("Liest den Bestand neu ein …", "Inventar");
  const r = await api("/api/neu");
  if (r.ok) location.reload();
  else if (r.harnessWechsel) harnessGewechselt(r);
  else setMeldung("Neu einlesen fehlgeschlagen:\n\n" + r.ausgabe, "Fehler");
}
/* Nach gelungenen Aktionen stimmt die Seite nicht mehr: Erledigte Zeilen blieben stehen und ließen sich noch einmal
   ausführen. Schlug etwas fehl, bleibt die Seite, damit die Meldung dazu stehen bleibt. Die gespeicherte Wahl
   erledigter Einträge fällt weg, sonst stünde sie nach einem späteren Umschalten wieder vorbelegt da. */
async function nachAktionen(paare) {
  if (!paare.every(([e]) => ERGEBNIS.get(e.id)?.ok)) return;
  paare.forEach(([e]) => delete abweichung[e.id]);
  try { localStorage.setItem(SPEICHER, JSON.stringify(abweichung)); } catch (_) { /* ohne Speicher nichts zu löschen */ }
  await neuEinlesen();
}

  const inhalte = teile.map(([, html], i) => `<div role="tabpanel" id="hilfe-teil-${i}" aria-labelledby="hilfe-reiter-${i}"${i ? " hidden" : ""}>${html}</div>`).join("");
  return abschnitt("hilfe", "So funktioniert das Dashboard",
    `<div class="hilfe"><div class="unterreiter" role="tablist" aria-label="Hilfe">${reiter}</div>${inhalte}</div>`);
}
function waehleReiter(gewaehlt) {
  gewaehlt.parentElement.querySelectorAll('[role="tab"]').forEach(r => {
    r.setAttribute("aria-selected", r === gewaehlt);
    r.tabIndex = r === gewaehlt ? 0 : -1; /* Tab springt zum Inhalt, zwischen den Reitern wechseln die Pfeiltasten */
    document.getElementById(r.getAttribute("aria-controls")).hidden = r !== gewaehlt;
  });
  filterHoehen();
}
document.addEventListener("keydown", ev => {
  const reiter = ev.target.closest?.('[role="tab"]');
  if (!reiter || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(ev.key)) return;
  const alle = [...reiter.parentElement.querySelectorAll('[role="tab"]')];
  const i = alle.indexOf(reiter);
  const ziel = alle[{ ArrowLeft: (i - 1 + alle.length) % alle.length, ArrowRight: (i + 1) % alle.length, Home: 0, End: alle.length - 1 }[ev.key]];
  ev.preventDefault();
  waehleReiter(ziel);
  ziel.focus();
});

function kopiere(text, knopf) {
  /* Den Ursprungstext am Knopf merken: Ein zweiter Klick binnen 1,4 s hielte sonst „kopiert“ für den Ursprung */
  const fertig = () => { knopf.dataset.ursprung ??= knopf.textContent; knopf.textContent = "kopiert"; setTimeout(() => { knopf.textContent = knopf.dataset.ursprung; }, 1400); };
  const notweg = () => {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); fertig(); } catch (_) { /* Kopieren nicht möglich, Text bleibt markierbar */ }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(fertig, notweg);
  else notweg();
}

/* Die Version nennt den Harness oft schon: „2.1.273 (Claude Code)“ steht sonst neben „Claude Code“ */
const version = (D.version || "").replace(` (${D.harness_name})`, "").trim();
/* Darstellung umschalten. Ohne eigene Wahl folgt die Seite der Systemeinstellung; die Wahl überlebt das Neuladen. */
const THEMA_SPEICHER = "3zero-harness-inventur:thema";
const MOND = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const SONNE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>';
let themaWahl = null;
try { themaWahl = localStorage.getItem(THEMA_SPEICHER); } catch (_) { /* ohne Speicher gilt die Systemeinstellung */ }
const istDunkel = () => themaWahl ? themaWahl === "dunkel" : matchMedia("(prefers-color-scheme: dark)").matches;
function themaZeigen() {
  const knopf = document.getElementById("thema");
  knopf.innerHTML = istDunkel() ? SONNE : MOND;
  knopf.title = istDunkel() ? "Auf helle Darstellung wechseln" : "Auf dunkle Darstellung wechseln";
}
document.getElementById("thema").addEventListener("click", () => {
  themaWahl = istDunkel() ? "hell" : "dunkel";
  try { localStorage.setItem(THEMA_SPEICHER, themaWahl); } catch (_) { /* dann gilt sie nur für diese Seite */ }
  document.documentElement.dataset.thema = themaWahl;
  themaZeigen();
});
/* Ohne eigene Wahl folgt der Knopf dem System, auch wenn es sich während der Sitzung ändert */
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!themaWahl) themaZeigen(); });
themaZeigen();

const marke = HARNESS_MARKE[D.harness];
document.getElementById("stand").innerHTML =
  (marke ? `<svg class="harness-marke" viewBox="0 0 ${marke.viewBox} ${marke.viewBox}" aria-hidden="true"><path d="${marke.pfad}" fill="${marke.farbe}"></path></svg>` : "") +
  esc(D.harness_name) + (version ? ` · ${esc(version)}` : "");
/* Als Datei geöffnet gibt es keine Knöpfe. Die Zeitangaben stehen trotzdem rechts, wo sie sonst unter ihnen hängen:
   In der Zeile neben dem Titel machten sie den Kopf so breit, dass er in schmaleren Fenstern auseinanderbrach. */
if (!AKTIONEN) document.getElementById("aktionen").innerHTML =
  `<div class="knopfstapel nur-zeit"><span class="zeit">Bestand vom ${zeitpunkt(D.erstellt)}</span><span class="zeit">Bewertung vom ${BEWERTET}</span></div>`;
document.getElementById("app").innerHTML =
  renderUeberblick() + renderEmpfehlungen() + renderGruppen() + renderMcp() + renderPlugins() + renderSkillsRahmen() + renderHooks() + renderProjekte() + renderWerkzeuge() + renderBerechtigungen() + renderModelle() + renderHinweise() + renderSuche() + renderHilfe();
/* Gemerkte Werte in die Felder; gibt es eine gemerkte Auswahl nicht mehr (etwa eine Herkunft), gilt wieder „alle“ */
for (const [id, feld] of FILTERFELDER) {
  const el = document.getElementById(id);
  el.value = F[feld];
  if (el.value !== F[feld]) F[feld] = "";
}
document.getElementById("f-teile").checked = F.teile;
skillsFiltern();
tabellenFilter();
document.getElementById("empf-suche").addEventListener("input", empfFiltern);
/* Der Tabellenkopf steht unter dem Filter: dessen Höhe (er bricht um) als --filter an dem Element danach.
   Beim Wechsel von Tab und Reiter sofort, nicht erst mit dem nächsten Bild: Sonst läge der Kopf kurz unter dem Filter. */
const filterHoehe = f => f.nextElementSibling.style.setProperty("--filter", f.offsetHeight + "px");
const filterHoehen = () => document.querySelectorAll("#app .filter").forEach(filterHoehe);
document.querySelectorAll("#app .filter").forEach(f => new ResizeObserver(() => filterHoehe(f)).observe(f));
{
  const handeln = (D.werkzeuge || []).filter(w => ["veraltet", "ohne Pflege", "fehlt"].includes(w.status)).length
    + (D.quellcode || []).filter(q => q.befehl || q.upstream.befehl).length;
  document.getElementById("zahl-versionen").textContent = handeln ? ` (${handeln})` : "";
  const breit = (D.berechtigungen || []).filter(z => z.marken.includes("breit")).length;
  document.getElementById("zahl-berechtigungen").textContent = breit ? ` (${breit})` : "";
  document.getElementById("zahl-einstellungen").textContent = handeln + breit ? ` (${handeln + breit})` : "";
}
if (TOKEN) zeichne(); else renderEmpfInhalt();
renderMeldung();

/* Tabs: sichtbar ist nur der Abschnitt aus dem Hash, sonst der erste. Gehört er zu einer Gruppe, steht deren
   zweite Zeile darunter, und oben ist die Gruppe markiert. */
function zeigeTab() {
  const abschnitte = [...document.querySelectorAll("#app > section")];
  const aktiv = abschnitte.find(s => "#" + s.id === location.hash) || abschnitte[0];
  abschnitte.forEach(s => { s.hidden = s !== aktiv; });
  const gruppe = document.querySelector(`nav .unternav a[href="#${aktiv.id}"]`)?.parentElement.dataset.gruppe;
  document.querySelectorAll("nav .unternav").forEach(u => { u.hidden = u.dataset.gruppe !== gruppe; });
  document.querySelectorAll("nav a").forEach(a =>
    (a.dataset.gruppe ? a.dataset.gruppe === gruppe : a.hash === "#" + aktiv.id) ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  kopfHoehe(); /* die zweite Zeile der Tabs kommt oder geht */
  filterHoehen();
  window.scrollTo(0, 0);
}
/* Kopf und Tabs stehen fest: Sprungziele um ihre Höhe versetzen, auch wenn die Tabs umbrechen */
const kopf = document.querySelector(".seitenkopf");
const kopfHoehe = () => document.documentElement.style.setProperty("--kopf", kopf.offsetHeight + "px");
kopfHoehe(); /* sofort, sonst springt der Browser beim Laden mit Anker noch ohne Versatz */
new ResizeObserver(kopfHoehe).observe(kopf);
zeigeTab();
window.addEventListener("hashchange", zeigeTab);

document.addEventListener("click", ev => {
  const knopf = ev.target.closest("[data-copy]");
  if (knopf) { kopiere(knopf.dataset.copy, knopf); return; }
  const mehr = ev.target.closest("#meldung-mehr");
  if (mehr) {
    const gekuerzt = document.querySelector(".meldung .inhalt").classList.toggle("gekuerzt");
    mehr.textContent = gekuerzt ? "ganz anzeigen" : "kürzen";
    return;
  }
  const reiter = ev.target.closest('[role="tab"]');
  if (reiter) { waehleReiter(reiter); return; }
  const th = ev.target.closest("th[data-sort]");
  if (th) {
    F.richtung = F.sort === th.dataset.sort ? -F.richtung : (th.dataset.sort === "name" ? 1 : -1);
    F.sort = th.dataset.sort;
    skillsFiltern();
    return;
  }
  const auf = ev.target.closest("button.aufklappen");
  if (auf) { klappe(auf.closest("tr.haupt")); return; }
  if (ev.target.closest("a, button, input, select")) return;
  const zeile = ev.target.closest("tr.haupt");
  if (zeile && !window.getSelection().toString()) klappe(zeile);
});
function klappe(zeile) {
  const detail = zeile.nextElementSibling;
  if (!detail?.matches(".detail, .inhalt")) return;
  detail.hidden = !detail.hidden;
  zeile.classList.toggle("offen", !detail.hidden);
  zeile.querySelector("button.aufklappen")?.setAttribute("aria-expanded", !detail.hidden);
}
for (const [id, feld] of FILTERFELDER) {
  document.getElementById(id).addEventListener("input", ev => { F[feld] = ev.target.value; skillsFiltern(); });
}
document.getElementById("f-teile").addEventListener("change", ev => { F.teile = ev.target.checked; skillsFiltern(); });

if (TOKEN) {
  document.addEventListener("change", ev => {
    const s = ev.target.closest("select.wahl");
    if (!s) return;
    waehle(s.dataset.wahl, s.value);
    zeichne(); /* baut die Empfehlungen neu, deshalb danach den Fokus zurücksetzen */
    document.querySelectorAll("select.wahl").forEach(x => {
      if (x.dataset.wahl === s.dataset.wahl) { x.value = s.value; x.classList.toggle("gesetzt", !!s.value); }
    });
    if (!document.body.contains(s)) document.querySelector(`select.wahl[data-wahl="${CSS.escape(s.dataset.wahl)}"]`)?.focus();
  });
  document.addEventListener("click", async ev => {
    const knopf = ev.target.closest("#alle-ausfuehren, #neu-einlesen, #bewerten, #meldung-zu, #meldung-neu-laden, #suche-verwerfen, [data-ausfuehren], [data-installieren], [data-abbrechen], [data-recht]");
    if (!knopf) return;
    if (knopf.dataset.abbrechen) {
      /* Nur anstoßen: Das Ende meldet die laufende Abfrage des Standes, auch wenn der Lauf gerade von selbst fertig wurde */
      knopf.disabled = true;
      api("/api/abbrechen", { art: knopf.dataset.abbrechen });
      return;
    }
    if (knopf.id === "meldung-neu-laden") return location.reload();
    if (knopf.id === "meldung-zu") {
      if (offenerLauf) api(`/api/${offenerLauf}`, { verwerfen: true });
      offenerLauf = ""; return setMeldung("");
    }
    if (knopf.id === "suche-verwerfen") {
      suchStand = await api("/api/suche", { verwerfen: true });
      kandidaten = []; INSTALLATION.clear(); return renderSuchInhalt();
    }
    if (knopf.id === "alle-ausfuehren") {
      /* Eintrag und Aktion hier festhalten: Genau diese Paare stehen im Dialog und laufen danach */
      const paare = warteschlange().filter(e => !ERGEBNIS.get(e.id)?.ok).map(e => [e, gewaehlt(e)]);
      const warnungen = [...new Set(paare.map(([e, a]) => warnung(e, a)).filter(Boolean))];
      const liste = paare.map(([e, a]) => `${a}: ${e.name}${e.projekt ? ` (${e.projekt.split("/").pop()})` : ""}`);
      if (await frage("Aktionen ausführen", `${paare.length} Aktionen laufen nacheinander. Sie wirken ab der nächsten ${je("Claude-Code", D.harness_name)}-Sitzung.`
          + (warnungen.length ? "\n\n" + warnungen.join("\n\n") : ""), `${paare.length} ausführen`, liste))
        mitSperre(async () => { for (const [e, a] of paare) await fuehreAus(e, a); await nachAktionen(paare); });
    } else if (knopf.id === "neu-einlesen") {
      mitSperre(neuEinlesen);
    } else if (knopf.id === "bewerten") {
      if (!await frage("Bewertung nachziehen", `${je("Claude", D.harness_name)} liest den Bestand neu ein und zieht die Bewertung nach: neue Einträge beschreiben, entfernte austragen, Gruppen und Hinweise prüfen.\n\nDas dauert einige Minuten und verbraucht Kontingent deines ${je("Claude", "ChatGPT")}-Abos.`, "starten")) return;
      mitSperre(async () => {
        const r = await api("/api/bewerten");
        if (r.harnessWechsel) return harnessGewechselt(r);
        if (!r.ok) return setMeldung("Bewertung nicht gestartet:\n\n" + r.ausgabe, "Fehler");
        await bewertungVerfolgen();
      });
    } else if (knopf.dataset.installieren !== undefined) {
      const nr = Number(knopf.dataset.installieren), k = kandidaten[nr], manuell = !!knopf.dataset.manuell;
      if (!await frage(`${k.name} installieren?`, `${ART[k.art]} ${k.name}${manuell ? " wird installiert und auf „nur manuell“ gestellt" : " wird installiert"}. Er läuft danach mit deinen vollen Rechten.\n\nWirksam ab der nächsten ${je("Claude-Code", D.harness_name)}-Sitzung.`, manuell ? "installieren, nur manuell" : "installieren")) return;
      mitSperre(async () => {
        INSTALLATION.set(nr, { laeuft: true }); renderSuchInhalt();
        const r = await api("/api/installieren", { nr, nur_manuell: manuell });
        INSTALLATION.set(nr, r);
        if (!r.ok) return;
        const neu = await api("/api/neu");
        if (!neu.ok) return setMeldung("Neu einlesen fehlgeschlagen:\n\n" + neu.ausgabe, "Fehler");
        location.reload(); /* der Tab holt sich die Suche danach vom Server zurück, mit „installiert“ am Kandidaten */
      });
    } else if (knopf.dataset.recht !== undefined) {
      const z = (D.berechtigungen || []).find(r => r.id === knopf.dataset.recht);
      if (!z) return;
      const ordner = z.art === "Vertrauen";
      const text = ordner
        ? `Der vertraute Ordner ${kurzPfad(z.bereich)} wird aus ~/.codex/config.toml genommen. Es gibt ihn nicht mehr.`
        : `Die Regel ${z.regel} (${RECHT_ART[z.art] || z.art}) wird aus ${z.quelle} genommen.` +
          (z.marken.includes("breit") ? `\n\nDanach fragt ${D.harness_name} bei solchen Befehlen wieder nach.` : "");
      if (!await frage(ordner ? "Vertrauten Ordner entfernen?" : "Regel entfernen?", text + "\n\nVorher legt der Server eine Sicherung neben die Datei (.bak-<Zeitstempel>).", "entfernen")) return;
      mitSperre(async () => {
        const r = await api("/api/ausfuehren", { id: z.id, aktion: "entfernen" });
        if (r.harnessWechsel) return harnessGewechselt(r);
        if (!r.ok) return setMeldung("Entfernen fehlgeschlagen:\n\n" + r.ausgabe, "Fehler");
        await neuEinlesen();
      });
    } else {
      const e = INDEX.get(knopf.dataset.ausfuehren), a = gewaehlt(e);
      mitSperre(async () => { await fuehreAus(e, a); await nachAktionen([[e, a]]); });
    }
  });

  document.getElementById("suchform").addEventListener("submit", async ev => {
    ev.preventDefault();
    const bedarf = document.getElementById("bedarf").value.trim();
    const knopf = document.getElementById("suchen");
    if (!bedarf || knopf.disabled) return;
    knopf.disabled = true; /* sofort: bis der Server antwortet, ginge sonst eine zweite Suche los */
    kandidaten = []; INSTALLATION.clear();
    const r = await api("/api/suchen", { bedarf });
    if (r.ok) return sucheVerfolgen();
    suchStand = { ...r, laeuft: false, bedarf };
    renderSuchInhalt(); /* gibt den Knopf wieder frei */
  });

  /* Laufende oder fertige Claude-Läufe liegen auf dem Server und überstehen so das Neuladen der Seite */
  api("/api/bewertung").then(b => {
    if (b.harnessWechsel) harnessGewechselt(b);
    else if (b.laeuft) mitSperre(bewertungVerfolgen);
    else if ("ok" in b && b.verbindung !== false) bewertungZeigen(b);
  });
  sucheVerfolgen();
}
const warte = ms => new Promise(fertig => setTimeout(fertig, ms));
async function bewertungVerfolgen() {
  for (;;) {
    const b = await api("/api/bewertung");
    /* bewertungLaeuft vor jeder Meldung zurücksetzen, sonst trägt die Fehlerkarte „abbrechen“ statt „schließen“ */
    if (b.verbindung === false) { bewertungLaeuft = false; return setMeldung(b.ausgabe, "Fehler"); }
    if (b.harnessWechsel) { bewertungLaeuft = false; return harnessGewechselt(b); }
    if (!b.laeuft) { bewertungLaeuft = false; return location.reload(); } /* Bewertung und dashboard.html sind neu; die Karte zeigt die Seite danach */
    bewertungLaeuft = b.abgebrochen ? "abbruch" : "ja"; /* der Knopf entsteht alle zwei Sekunden neu und bliebe sonst klickbar */
    setMeldung(`${je("Claude", esc(D.harness_name))} liest den Bestand ein und zieht die Bewertung nach … (${b.sekunden} s)`, "Bewertung läuft");
    await warte(2000);
  }
}
function harnessGewechselt(b) {
  seiteVeraltet = true;
  setMeldung(b.ausgabe, "Anderer Harness");
}
function bewertungZeigen(b) {
  offenerLauf = "bewertung";
  if (b.abgebrochen) return setMeldung("Die Bewertung wurde abgebrochen. Die bisherige Bewertung gilt weiter.", "Bewertung abgebrochen");
  setMeldung(b.ok ? b.ausgabe : "Bewertung fehlgeschlagen:\n\n" + b.ausgabe, b.ok ? "Ergebnis der Bewertung" : "Fehler bei der Bewertung");
}
async function sucheVerfolgen() {
  for (;;) {
    suchStand = await api("/api/suche");
    if (!suchStand.laeuft) kandidaten = suchStand.kandidaten || [];
    renderSuchInhalt();
    if (!suchStand.laeuft) return;
    await warte(2000);
  }
}
</script>
